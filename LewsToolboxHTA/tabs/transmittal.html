<!DOCTYPE html>
<html>
<head>
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta charset="utf-8">
<title>Transmittal</title>
<meta name="lt-order" content="4">
<meta name="lt-group" content="Work">
<meta name="lt-icon" content="&#128232;">
<meta name="lt-desc" content="Makes a numbered transmittal sheet (TR-001, TR-002...) in Excel for the documents you issue, and keeps a log of everything sent.">
<!--
  Lew's Toolbox - Transmittal maker: an issue sheet (Excel, or CSV without Excel) from picked files, a pasted list,
  or the "Found" files of Submission Check. Numbers itself (TR-001...), keeps a log, can copy the files into a
  transmittal folder. Data: transmittals.json (the Weekly report reads it).
-->
<style>
#app{display:flex;flex-direction:column;height:100%}
.step{flex:none;padding:10px 14px 4px}
#docs{flex:1 1 auto;overflow:auto;min-height:0}
.num{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;font-weight:bold;margin:0 8px 6px 0;vertical-align:middle}
.lbl{display:inline-block;margin:0 8px 6px 0;vertical-align:middle}
.big{font-weight:bold}
#head .fld{display:inline-block;width:230px;margin:0 10px 6px 0;vertical-align:top}
#head .fld.w{width:470px}
#docs input{width:100%;height:26px}
#docs td{padding:2px 4px}
.right{float:right}
</style>
<script src="../core/lt-core.js"></script>
</head>
<body>
<div id="app">
  <div class="step bar" id="head">
    <span class="num">1</span><span class="lbl big" id="noLbl"></span><span class="lbl muted" id="dateLbl"></span><span class="right"><button class="btn small" id="bLog">Sent log &#9662;</button><button class="btn small" id="bNew">New transmittal</button></span><br>
    <div class="fld"><label>Project</label><input type="text" id="hProj"></div>
    <div class="fld"><label>To (company)</label><input type="text" id="hTo" list="toList"></div>
    <div class="fld"><label>Attention (person)</label><input type="text" id="hAttn"></div>
    <div class="fld"><label>Purpose of issue</label><select id="hPurp"><option>For information</option><option>For comment</option><option>For review and approval</option><option>For coordination</option><option>For tender</option><option>For construction</option><option>As built</option></select></div>
    <div class="fld w"><label>Notes</label><input type="text" id="hNotes" placeholder="optional"></div>
  </div>
  <div class="step">
    <span class="num">2</span><span class="lbl big">Documents</span>
    <button class="btn" id="bFolder">+ From a folder...</button><button class="btn" id="bPaste">+ Paste a list...</button><button class="btn" id="bTitles">Fill titles from my list</button>
    <span class="lbl muted" id="cnt"></span>
  </div>
  <div id="docs"></div>
  <div class="step bar" style="border-top-width:1px;border-top-style:solid">
    <span class="num">3</span><button class="btn primary" id="bMake">&#128232; Make the transmittal</button>
    <label class="lbl"><input type="checkbox" id="copyFiles" style="height:auto"> also copy the files into a transmittal folder</label>
    <span class="lbl muted" id="outLbl"></span>
  </div>
</div>
<datalist id="toList"></datalist>
<script>
var $ = LT.$, esc = LT.esc, fso = LT.fso, store, docs = [];
var REV = /^([A-Z]{1,2}\d{1,3}|\d{2,3})$/i;
function FILE() { return LT.dataPath("transmittals.json"); }
function load() { store = LT.readJson(FILE(), null) || {}; store.next = store.next || 1; store.prefix = store.prefix || "TR-"; store.log = store.log || []; store.project = store.project || ""; store.out = store.out || ""; }
function save() { try { LT.saveJson(FILE(), store); } catch (e) { alert("Couldn't save the transmittal log."); } }
function no(n) { var s = "" + n; while (s.length < 3) s = "0" + s; return store.prefix + s; }
function split(stem) { var i = Math.max(stem.lastIndexOf("-"), stem.lastIndexOf("_")); if (i > 0 && (stem.match(/[-_]/g) || []).length >= 2 && REV.test(stem.substring(i + 1))) return { base: stem.substring(0, i), rev: stem.substring(i + 1).toUpperCase() }; return { base: stem, rev: "" }; }
function header() {
  $("noLbl").innerHTML = "Transmittal " + esc(no(store.next)); var d = new Date(); $("dateLbl").innerHTML = d.getDate() + " " + LT.MON[d.getMonth()] + " " + d.getFullYear();
  if (!$("hProj").value) $("hProj").value = store.project;
  var seen = {}, h = ""; for (var i = store.log.length - 1; i >= 0; i--) { var t = store.log[i].to; if (t && !seen[t]) { seen[t] = 1; h += '<option value="' + esc(t) + '">'; } } $("toList").innerHTML = h;
  $("outLbl").innerHTML = $("copyFiles").checked ? "&rarr; " + esc(outDir()) : "";
}
function outDir() { return (store.out || LT.exportsDir() + "\\Transmittals") + "\\" + no(store.next); }

/* ---------- documents ---------- */
/* adds files, one row per drawing + revision, with all its file types */
function addFiles(paths) {
  var added = 0;
  for (var i = 0; i < paths.length; i++) { var p = paths[i], n = fso.GetFileName(p), k = n.lastIndexOf("."), ext = k > 0 ? n.substring(k + 1).toLowerCase() : "", s = split(k > 0 ? n.substring(0, k) : n), row = null;
    for (var j = 0; j < docs.length; j++) if (docs[j].number.toUpperCase() == s.base.toUpperCase() && docs[j].rev.toUpperCase() == s.rev) row = docs[j];
    if (!row) { row = { number: s.base, title: "", rev: s.rev, types: [], files: [] }; docs.push(row); added++; }
    if (ext && row.types.indexOf(ext) < 0) row.types.push(ext); if (row.files.indexOf(p) < 0) row.files.push(p); }
  docs.sort(function (a, b) { return a.number.toUpperCase() < b.number.toUpperCase() ? -1 : 1; });
  render(); return added;
}
function fromFolder() {
  var d = LT.pickFolder("Pick the folder with the files to issue"); if (!d) return;
  var list = [], walk = function (dir) { var fo = fso.GetFolder(dir), e = new Enumerator(fo.Files); for (; !e.atEnd(); e.moveNext()) { var f = e.item(); if (!(f.Attributes & 6) && !/^~\$|^thumbs\.db$|^desktop\.ini$/i.test("" + f.Name)) list.push("" + f.Path); }
    var s = new Enumerator(fo.SubFolders); for (; !s.atEnd(); s.moveNext()) if (!(s.item().Attributes & 6)) walk("" + s.item().Path); };
  try { walk(d); } catch (e) { alert("Couldn't read that folder."); return; }
  var n = addFiles(list); LT.toast(n + " document(s) added"); fillTitles(true);
}
function pasteList() {
  var t = prompt("Paste drawing numbers, one per line (or separated by ;).\nYou can add the revision after a tab or space, e.g.\n5013-KEO-ZZ-DR-A-10101  P02", ""); if (!t) return;
  var ls = t.split(/\r?\n|;/);
  for (var i = 0; i < ls.length; i++) { var l = LT.trim(ls[i]); if (!l) continue; var p = l.split(/\t|\s{2,}|\s(?=[A-Z]{1,2}\d{1,3}$)/), num = LT.trim(p[0]).replace(/\.[a-z0-9]{2,4}$/i, ""), rev = LT.trim(p[1] || ""), s = split(num);
    if (!rev && s.rev) { num = s.base; rev = s.rev; } docs.push({ number: num, title: LT.trim(p[2] || ""), rev: rev.toUpperCase(), types: [], files: [] }); }
  render(); fillTitles(true);
}
/* titles from the list Submission Check uses (check.json) */
function fillTitles(quiet) {
  var c = LT.readJson(LT.dataPath("check.json"), null);
  if (!c || !c.list || !fso.FileExists(c.list) || !c.colTitle) { if (!quiet) alert("Set up your list in Submission Check first (with its Title column) - titles are taken from there."); return; }
  var need = false; for (var i = 0; i < docs.length; i++) if (!docs[i].title) need = true; if (!need) { if (!quiet) LT.toast("All documents already have a title"); return; }
  if (quiet && /\.(xlsx|xlsm|xls)$/i.test(c.list)) return;     // reading Excel takes a moment - only when asked
  var L; try { L = LT.readList(c.list, c.sheet); } catch (e) { if (!quiet) alert("Couldn't read the list - is it open in Excel?"); return; }
  var t = L.table, cn = L.head.indexOf(c.colName), ct = L.head.indexOf(c.colTitle);
  if (cn < 0 || ct < 0) { if (!quiet) alert("Couldn't find the columns " + c.colName + " / " + c.colTitle + " in the list."); return; }
  var map = {}; for (var k = L.headRow + 1; k < t.length; k++) { var nm = split(LT.cell(t[k], cn).replace(/\.[a-z0-9]{2,4}$/i, "")).base.toUpperCase(); if (nm) map[nm] = LT.cell(t[k], ct); }
  var n = 0; for (var d = 0; d < docs.length; d++) if (!docs[d].title && map[docs[d].number.toUpperCase()]) { docs[d].title = map[docs[d].number.toUpperCase()]; n++; }
  render(); if (n || !quiet) LT.toast(n + " title(s) filled from your list");
}
function render() {
  var h = ['<table class="grid"><tr><th style="width:40px">No.</th><th>Drawing / document number</th><th>Title</th><th style="width:70px">Rev</th><th style="width:110px">Format</th><th style="width:30px"></th></tr>'];
  for (var i = 0; i < docs.length; i++) { var d = docs[i];
    h.push("<tr><td>" + (i + 1) + '</td><td><input type="text" data-i="' + i + '" data-k="number" value="' + esc(d.number) + '"></td><td><input type="text" data-i="' + i + '" data-k="title" value="' + esc(d.title) + '"></td><td><input type="text" data-i="' + i + '" data-k="rev" value="' + esc(d.rev) + '"></td><td><input type="text" data-i="' + i + '" data-k="types" value="' + esc(d.types.join(", ")) + '"></td><td><button class="btn small" data-rm="' + i + '" style="margin:0">&#10005;</button></td></tr>'); }
  h.push("</table>");
  $("docs").innerHTML = docs.length ? h.join("") : '<div class="muted" style="padding:24px;line-height:1.8">Add the documents: <b>From a folder</b>, <b>Paste a list</b>, or in <b>Submission Check</b> use <b>Report &#9662; &gt; Make a transmittal</b>.<br>Titles can be filled from your list (the one set up in Submission Check).</div>';
  $("cnt").innerHTML = docs.length ? docs.length + " document(s)" : "";
}

/* ---------- make it ---------- */
function make() {
  if (!docs.length) { alert("Add the documents first."); return; }
  if (!LT.trim($("hTo").value) && !confirm("No recipient (To) - make it anyway?")) return;
  var t = { no: no(store.next), date: LT.today(), project: LT.trim($("hProj").value), to: LT.trim($("hTo").value), attn: LT.trim($("hAttn").value), purpose: $("hPurp").value, notes: LT.trim($("hNotes").value), by: LT.settings().userName || "", items: [] };
  for (var i = 0; i < docs.length; i++) t.items.push({ number: docs[i].number, title: docs[i].title, rev: docs[i].rev, types: docs[i].types.join(", "), files: docs[i].files });
  var dir = (store.out || LT.exportsDir() + "\\Transmittals") + "\\" + t.no, base = dir + "\\" + t.no + "_" + LT.safeName(t.to || "Transmittal").replace(/ /g, "_") + "_" + LT.today(), made = null, copied = 0, errs = [];
  LT.mkdirs(dir);
  try { made = excel(base + ".xlsx", t); } catch (e) { try { made = csv(base + ".csv", t); LT.toast("Excel isn't available - saved as CSV"); } catch (e2) { alert("Couldn't make the transmittal:\n" + (e.message || e)); return; } }
  if ($("copyFiles").checked) for (var k = 0; k < docs.length; k++) for (var f = 0; f < docs[k].files.length; f++) { var src = docs[k].files[f], to = dir + "\\" + fso.GetFileName(src);
    try { if (fso.FileExists(to)) throw new Error("already there"); fso.CopyFile(src, to, false); copied++; } catch (e) { errs.push(fso.GetFileName(src) + ": " + (e.message || e)); } }
  t.file = made; store.log.push(t); store.next++; store.project = t.project; save();
  try { LT.open(dir); } catch (e) { }
  alert(t.no + " is ready:\n" + fso.GetFileName(made) + (copied ? "\n\n" + copied + " file(s) copied into the transmittal folder." : "") + (errs.length ? "\n\nNot copied (" + errs.length + "):\n" + errs.slice(0, 10).join("\n") : "") + "\n\nThe next one will be " + no(store.next) + ".");
  docs = []; $("hNotes").value = ""; header(); render();
}
function csv(path, t) {
  var rows = [["TRANSMITTAL", t.no], ["Project", t.project], ["To", t.to], ["Attention", t.attn], ["From", t.by], ["Date", t.date], ["Purpose of issue", t.purpose], ["Notes", t.notes], [], ["No.", "Drawing / document number", "Title", "Rev", "Format"]];
  for (var i = 0; i < t.items.length; i++) rows.push([i + 1, t.items[i].number, t.items[i].title, t.items[i].rev, t.items[i].types]);
  rows.push([], ["Issued by", t.by, "Received by", ""]); LT.writeCsv(path, rows); return path;
}
function excel(path, t) {
  var xl = null, wb = null;
  try {
    xl = new ActiveXObject("Excel.Application"); xl.Visible = false; xl.DisplayAlerts = false;
    wb = xl.Workbooks.Add(); while (wb.Worksheets.Count > 1) wb.Worksheets(wb.Worksheets.Count).Delete();
    var ws = wb.Worksheets(1); ws.Name = "Transmittal";
    var W = [6, 38, 50, 8, 14]; for (var c = 0; c < W.length; c++) ws.Columns(c + 1).ColumnWidth = W[c];
    ws.Cells(1, 1).Value = "TRANSMITTAL"; ws.Cells(1, 1).Font.Size = 18; ws.Cells(1, 1).Font.Bold = true;
    ws.Cells(1, 5).Value = t.no; ws.Cells(1, 5).Font.Size = 14; ws.Cells(1, 5).Font.Bold = true; ws.Cells(1, 5).HorizontalAlignment = -4152;
    var head = [["Project", t.project], ["To", t.to], ["Attention", t.attn], ["From", t.by], ["Date", ""], ["Purpose of issue", t.purpose]];
    for (var i = 0; i < head.length; i++) { ws.Cells(3 + i, 1).Value = head[i][0]; ws.Cells(3 + i, 1).Font.Bold = true; ws.Cells(3 + i, 2).Value = head[i][1]; }
    var d = LT.parseIso(t.date); ws.Cells(7, 2).Formula = "=DATE(" + d.getFullYear() + "," + (d.getMonth() + 1) + "," + d.getDate() + ")"; ws.Cells(7, 2).Value2 = ws.Cells(7, 2).Value2; ws.Cells(7, 2).NumberFormat = "dd mmm yyyy"; ws.Cells(7, 2).HorizontalAlignment = -4131;
    var r = 10, hdr = ["No.", "Drawing / document number", "Title", "Rev", "Format"];
    for (var h = 0; h < hdr.length; h++) { var hc = ws.Cells(r, h + 1); hc.Value = hdr[h]; hc.Font.Bold = true; hc.Font.Color = 0xFFFFFF; hc.Interior.Color = 0x7E3E5B; }
    for (var k = 0; k < t.items.length; k++) { r++; var it = t.items[k]; ws.Cells(r, 1).Value = k + 1; ws.Cells(r, 2).NumberFormat = "@"; ws.Cells(r, 2).Value = it.number; ws.Cells(r, 3).Value = it.title; ws.Cells(r, 4).NumberFormat = "@"; ws.Cells(r, 4).Value = it.rev; ws.Cells(r, 5).Value = it.types; ws.Cells(r, 3).WrapText = true; }
    try { var rg = ws.Range("A10:E" + r); rg.Borders.LineStyle = 1; rg.Borders.Color = 0xE2D7D0; } catch (e) { }
    r += 2; if (t.notes) { ws.Cells(r, 1).Value = "Notes"; ws.Cells(r, 1).Font.Bold = true; ws.Cells(r, 2).Value = t.notes; r += 2; }
    ws.Cells(r, 1).Value = "Issued by"; ws.Cells(r, 2).Value = t.by + "   ____________________"; ws.Cells(r, 3).Value = "Received by   ____________________   Date  __________";
    ws.Range("A" + r + ":C" + r).Font.Bold = true;
    try { ws.PageSetup.Orientation = 1; ws.PageSetup.Zoom = false; ws.PageSetup.FitToPagesWide = 1; ws.PageSetup.FitToPagesTall = false; } catch (e) { }
    if (fso.FileExists(path)) fso.DeleteFile(path);
    wb.SaveAs(path, 51); return path;
  } finally { try { if (wb) wb.Close(false); } catch (e) { } try { if (xl) xl.Quit(); } catch (e) { } }
}
function logMenu(x, y) {
  var m = [];
  for (var i = store.log.length - 1; i >= 0 && m.length < 15; i--) (function (t) { m.push({ label: esc(t.no) + " &nbsp; " + esc(t.date) + " &nbsp; " + esc(t.to || "(no recipient)") + " &nbsp; <span class=\"muted\">" + t.items.length + " doc(s)</span>", fn: function () { logEntry(t); } }); })(store.log[i]);
  if (!m.length) m.push({ label: "No transmittals yet", fn: function () { } });
  m.push("-", { label: "Numbering: " + esc(store.prefix) + " / next " + esc(no(store.next)) + "...", fn: function () { var p = prompt("Number prefix (e.g. TR-  or  5013-TR-):", store.prefix); if (p == null) return; var n = parseInt(prompt("Next number:", "" + store.next), 10); store.prefix = p; if (n > 0) store.next = n; save(); header(); } },
    { label: "Transmittal folder" + (store.out ? ": " + esc(store.out) : " (exports\\Transmittals)") + "...", fn: function () { var f = LT.pickFolder("Where should transmittals be saved? (e.g. 06 OUTGOING\\Transmittals)"); if (f) { store.out = f; save(); header(); } } },
    { label: "Export the log (CSV)", fn: function () { var t = [["No.", "Date", "Project", "To", "Attention", "Purpose", "Documents"]]; for (var i = 0; i < store.log.length; i++) { var e = store.log[i], n = []; for (var k = 0; k < e.items.length; k++) n.push(e.items[k].number + (e.items[k].rev ? " " + e.items[k].rev : "")); t.push([e.no, e.date, e.project, e.to, e.attn, e.purpose, n.join("; ")]); } var f = LT.exportsDir() + "\\Transmittal_log_" + LT.stamp() + ".csv"; LT.writeCsv(f, t); LT.open(f); } });
  LT.menu(x, y, m);
}
function logEntry(t) {
  LT.menu(200, 120, [{ label: "Open " + esc(t.no) + " file", fn: function () { try { LT.open(t.file); } catch (e) { alert("The file has moved."); } } },
    { label: "Use these documents again (new transmittal)", fn: function () { docs = []; for (var i = 0; i < t.items.length; i++) docs.push({ number: t.items[i].number, title: t.items[i].title, rev: t.items[i].rev, types: t.items[i].types ? t.items[i].types.split(/,\s*/) : [], files: t.items[i].files || [] });
      $("hTo").value = t.to; $("hAttn").value = t.attn; $("hProj").value = t.project; $("hPurp").value = t.purpose; render(); } }]);
}
$("bFolder").onclick = fromFolder; $("bPaste").onclick = pasteList; $("bTitles").onclick = function () { fillTitles(false); };
$("bMake").onclick = make; $("copyFiles").onclick = header;
$("bNew").onclick = function () { if (docs.length && !confirm("Clear the documents and start a new transmittal?")) return; docs = []; $("hTo").value = ""; $("hAttn").value = ""; $("hNotes").value = ""; render(); };
$("bLog").onclick = function (e) { var r = this.getBoundingClientRect(); logMenu(r.left - 200, r.bottom + 2); (e || window.event).cancelBubble = true; };
$("docs").onchange = function (e) { var t = e.target || e.srcElement, i = t.getAttribute && t.getAttribute("data-i"); if (i == null) return; var k = t.getAttribute("data-k"); docs[+i][k] = k == "types" ? LT.trim(t.value).split(/\s*,\s*/) : LT.trim(t.value); };
$("docs").onclick = function (e) { var b = LT.up(e.target || e.srcElement, "data-rm"); if (b) { docs.splice(+b.getAttribute("data-rm"), 1); render(); } };
function look() { LT.applyLook([".num{background:{accent};color:{accText};border-radius:{rc}px}", "#docs{background:{panel}}"]); }
window.ltTheme = look; window.ltReload = function () { load(); header(); };
/* from Submission Check: "add-files" with a JSON list of file paths */
window.ltReceive = function (what, value) { if (what == "add-files") { try { var n = addFiles(JSON.parse(value)); LT.toast(n + " document(s) added from Submission Check"); fillTitles(true); } catch (e) { } } };
look(); load(); header(); render(); LT.tabKeys();
</script>
</body>
</html>
