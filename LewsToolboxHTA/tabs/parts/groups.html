<!DOCTYPE html>
<html>
<head>
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta charset="utf-8">
<title>Folder Groups</title>
<meta name="lt-desc" content="What a folder holds, grouped by Tower, Typology and Model (from the MIDP). Click the arrow to open a group and see its drawings.">
<!--
  Lew's Toolbox - (a view inside the Folder Check tab) Groups: every drawing in a folder once, grouped by Tower > Typology > Model
  as the Drawing Register (MIDP) knows them. Groups fold open / shut in place (no redraw). Settings: groups.json { folder, subs, by }
-->
<style>
#app{display:flex;flex-direction:column;height:100%}
.step{flex:none;padding:10px 14px 4px}
#res{flex:1 1 auto;overflow:auto;min-height:0;padding:0 14px 14px}
.num{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;font-weight:bold;margin:0 8px 6px 0;vertical-align:middle}
.lbl{display:inline-block;margin:0 8px 6px 0;vertical-align:middle}
.big{font-weight:bold}
.path{display:inline-block;max-width:460px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;margin:0 8px 6px 0}
#gt{border-collapse:collapse;width:100%}
#gt td{padding:5px 8px;white-space:nowrap;vertical-align:middle}
#gt tr.g{cursor:pointer}
#gt tr.g td.gl{font-weight:bold}
.ar{display:inline-block;width:18px;text-align:center;font-size:11px}
.kind{font-size:11px;letter-spacing:.04em;margin-right:2px}
.cnt{font-size:12px;margin-left:8px}
.code{font-family:Consolas,'Lucida Console',monospace}
.ty{display:inline-block;padding:0 6px;margin-right:3px;font-size:11px;font-weight:bold}
.ttl{white-space:normal!important;max-width:520px}
#cf .card{width:900px;max-width:96vw}
#cfTree{height:46vh;overflow:auto;padding:6px 8px}
.cfr{display:flex;align-items:center;padding:2px 0}.cfr input{height:26px;width:280px;margin:0 8px 0 0;font-family:Consolas,monospace}.cfr .cnt{margin-left:0}
.cfi{display:inline-block;width:18px}
</style>
<script src="../../core/lt-core.js"></script>
<script src="../../core/lt-transmittal.js"></script>
</head>
<body>
<div id="app">
  <div class="step bar">
    <span class="num">1</span><button class="btn primary" id="bFolder">&#128194; Folder...</button><span class="path big" id="folderLbl"></span>
    <label class="lbl"><input type="checkbox" id="subs" checked style="height:auto"> include subfolders</label>
    <button class="btn small" id="bRescan">&#8635; Read again</button>
  </div>
  <div class="step bar">
    <span class="num">2</span><span class="lbl">Group by:</span>
    <select id="by" style="width:230px;height:26px;margin:0 8px 6px 0">
      <option value="tower,typo,model">Tower &rsaquo; Typology &rsaquo; Model</option>
      <option value="tower,model">Tower &rsaquo; Model</option>
      <option value="typo,model">Typology &rsaquo; Model</option>
      <option value="model">Model</option>
      <option value="tower">Tower</option>
    </select>
    <button class="btn small" id="bOpen">&#9662; Open all</button><button class="btn small" id="bShut">&#9656; Close all</button>
    <input type="text" id="q" placeholder="Search drawings" style="width:170px;margin:0 8px 6px 0">
    <button class="btn small primary" id="bCopy" title="Make the Tower / Typology / Model folders and copy (or move) the drawings into them - you can rename every folder first">&#128193; Copy into folders...</button>
    <span class="lbl big" id="sum"></span>
  </div>
  <div id="res"></div>
</div>
<div class="ov" id="cf"><div class="card">
  <h3>&#128193; Copy into folders <span class="muted small" id="cfN"></span></h3>
  <div class="muted small" style="margin-bottom:8px">The folders follow your grouping (<span id="cfBy"></span>). <b>Click a folder name to change it</b> &ndash; the new name is kept for next time (it changes that name everywhere at that level).</div>
  <div class="bar2" style="padding:0 0 6px">
    <button class="btn" id="cfDest">&#128194; Target folder...</button><span class="path big" id="cfDestL"></span>
  </div>
  <div class="bar2" style="padding:0 0 6px">
    <label class="lbl"><input type="radio" name="cfm" id="cfCopy" style="height:auto" checked> Copy (safe)</label><label class="lbl"><input type="radio" name="cfm" id="cfMove" style="height:auto"> Move</label>
    <span class="lbl">&middot; Revisions:</span><select id="cfRev" style="width:150px;height:26px;margin:0 8px 6px 0"><option value="all">All revisions</option><option value="last">The latest only</option></select>
    <label class="lbl"><input type="checkbox" id="cfOth" style="height:auto" checked> drawings not in the MIDP into</label><input type="text" id="cfOthN" style="width:110px;height:26px;margin:0 8px 6px 0">
  </div>
  <div id="cfTree"></div>
  <div class="acts"><button class="btn" id="cfReset" title="All folder names back to the Tower / Typology / Model values">Names back to normal</button><span class="sp"></span><span class="lbl small" id="cfMsg"></span><button class="btn" id="cfUndo" style="display:none">&#8630; Undo last run</button><button class="btn" id="cfCancel">Close</button><button class="btn primary" id="cfRun">&#9654; Copy</button></div>
</div></div>
<script>
var $ = LT.$, esc = LT.esc, fso = LT.fso, cfg, DW = [], OPEN = {};
var LEVEL = { tower: ["Tower", "no tower"], typo: ["Typology", "no typology"], model: ["Model", "no model"] };
function FILE() { return LT.dataPath("groups.json"); }
function load() { cfg = LT.readJson(FILE(), null) || {}; if (cfg.subs == null) cfg.subs = true; cfg.by = cfg.by || "tower,typo,model"; }
function save() { try { LT.saveJson(FILE(), cfg); } catch (e) { } }
function paths() { $("folderLbl").innerHTML = cfg.folder ? esc(cfg.folder) : '<span class="muted">not picked</span>'; $("subs").checked = cfg.subs; $("by").value = cfg.by; }
function U(x) { return LT.trim(x || "").toUpperCase(); }

/* ---------- read the folder: every drawing once (its revisions, file types, files) ---------- */
function scan(dir, deep, out) {
  try { var fo = fso.GetFolder(dir), e = new Enumerator(fo.Files);
    for (; !e.atEnd(); e.moveNext()) { var f = e.item(), n = "" + f.Name; if (f.Attributes & 6 || /^~\$|^thumbs\.db$|^desktop\.ini$/i.test(n)) continue; out.push({ full: "" + f.Path, name: n }); }
    if (deep) { var d = new Enumerator(fo.SubFolders); for (; !d.atEnd(); d.moveNext()) { var sf = d.item(); if (!(sf.Attributes & 6)) scan("" + sf.Path, true, out); } }
  } catch (x) { }
}
function run() {
  if (!cfg.folder || !fso.FolderExists(cfg.folder)) { DW = []; draw(); return; }
  var files = []; scan(cfg.folder, cfg.subs, files);
  var R = null; try { R = LT.register(); } catch (e) { }
  var by = {}; DW = [];
  for (var i = 0; i < files.length; i++) { var f = files[i], k = f.name.lastIndexOf("."), stem = k > 0 ? f.name.substring(0, k) : f.name, ext = k > 0 ? f.name.substring(k + 1).toLowerCase() : "", sp = LT.trSplit(stem), key = U(sp.base);
    var d = by[key]; if (!d) { d = by[key] = { base: sp.base, revs: [], types: [], files: [], hit: null }; DW.push(d); try { d.hit = R ? R.find(stem) : null; } catch (e) { } }
    if (sp.rev && d.revs.indexOf(sp.rev) < 0) d.revs.push(sp.rev); if (ext && d.types.indexOf(ext) < 0) d.types.push(ext); d.files.push(f.full); }
  for (var j = 0; j < DW.length; j++) { var x = DW[j], h = x.hit && x.hit.inMidp ? x.hit : null; x.revs.sort(LT.revCmp);
    x.no = h ? h.number : x.base; x.title = h ? h.title : ""; x.tower = h ? U(h.tower) : ""; x.typo = h ? U(h.typo) : ""; x.model = h ? U(h.model) : ""; x.inMidp = !!h; }
  DW.sort(function (a, b) { return a.no < b.no ? -1 : a.no > b.no ? 1 : 0; });
  draw();
}

/* ---------- the groups: one row per group (arrow + count), the drawings under the last level ---------- */
function natCmp(a, b) { var ea = a.charAt(0) == "\u0001", eb = b.charAt(0) == "\u0001"; if (ea != eb) return ea ? 1 : -1;   // "no tower" etc. last
  var x = a.replace(/\d+/g, function (n) { return ("0000000000" + n).slice(-10); }), y = b.replace(/\d+/g, function (n) { return ("0000000000" + n).slice(-10); }); return x < y ? -1 : x > y ? 1 : 0; }
function tree(list, levels) {
  var root = { kids: {}, order: [], items: [] };
  for (var i = 0; i < list.length; i++) { var d = list[i], node = root;
    if (!d.inMidp) { var nm = "\u0002"; if (!root.kids[nm]) { root.kids[nm] = { label: "Not in the MIDP", kind: "", kids: {}, order: [], items: [], miss: 1 }; } root.kids[nm].items.push(d); continue; }
    for (var l = 0; l < levels.length; l++) { var v = d[levels[l]], k = v ? v : "\u0001" + levels[l];
      if (!node.kids[k]) { node.kids[k] = { label: v || "(" + LEVEL[levels[l]][1] + ")", kind: LEVEL[levels[l]][0], kids: {}, order: [], items: [] }; node.order.push(k); }
      node = node.kids[k]; }
    node.items.push(d); }
  var srt = function (n) { n.order.sort(natCmp); for (var i2 = 0; i2 < n.order.length; i2++) srt(n.kids[n.order[i2]]); };
  srt(root); if (root.kids["\u0002"]) root.order.push("\u0002");
  return root;
}
function countIn(n) { var c = n.items.length; for (var i = 0; i < n.order.length; i++) c += countIn(n.kids[n.order[i]]); return c; }
function draw() {
  var q = U($("q").value), levels = cfg.by.split(","), list = [];
  if (!cfg.folder) { $("res").innerHTML = '<div class="muted" style="padding:24px;line-height:1.8">Pick a folder: every drawing in it is grouped by <b>Tower &rsaquo; Typology &rsaquo; Model</b> from the MIDP (Drawing Register).<br>Click a group\'s arrow to see its drawings.</div>'; $("sum").innerHTML = ""; return; }
  for (var i = 0; i < DW.length; i++) { var d = DW[i]; if (q && (U(d.no) + " " + U(d.title) + " " + d.tower + " " + d.typo + " " + d.model).indexOf(q) < 0) continue; list.push(d); }
  var root = tree(list, levels), h = ['<table id="gt" class="grid nonum">'], gid = 0, nIn = 0, ON = {};
  for (var c = 0; c < list.length; c++) if (list[c].inMidp) nIn++;
  var allOpen = function (ids) { for (var a = 0; a < ids.length; a++) if (!ON[ids[a]]) return false; return true; };
  var plural = function (lv, n) { var w = LEVEL[lv] ? LEVEL[lv][0].toLowerCase() : ""; return n == 1 ? w : lv == "typo" ? "typologies" : w + "s"; };
  /* ids: the group rows above (g1 g4 ...) - lp: their keys, so an open group stays open after Read again / a search */
  var walk = function (node, depth, ids, lp) {
    for (var i2 = 0; i2 < node.order.length; i2++) { var k = node.order[i2], g = node.kids[k], id = "g" + (++gid), key = gkey(lp, k), n = countIn(g), nx = levels[depth + 1];
      ON[id] = q ? true : !!OPEN[key];
      h.push('<tr class="g lv' + depth + (g.miss ? " miss" : "") + '" data-g="' + id + '" data-k="' + esc(key) + '" data-a="' + ids.join(" ") + '"' + (allOpen(ids) ? "" : ' style="display:none"') + '><td class="gl" colspan="4" style="padding-left:' + (8 + depth * 22) + 'px"><span class="ar">' + (ON[id] ? "&#9660;" : "&#9654;") + "</span>" +
        (g.kind ? '<span class="kind muted">' + g.kind + "</span> " : "") + '<span class="' + (g.kind == "Model" ? "code" : "") + '">' + esc(g.label) + "</span> " + '<span class="cnt muted">' + n + " drawing" + (n == 1 ? "" : "s") + "</span> " +
        (g.order.length ? '<span class="cnt muted">&middot; ' + g.order.length + " " + plural(nx, g.order.length) + "</span>" : "") + "</td></tr>");
      var path = ids.concat([id]); walk(g, depth + 1, path, lp.concat([k]));
      for (var j = 0; j < g.items.length; j++) { var d = g.items[j];
        h.push('<tr class="d" data-a="' + path.join(" ") + '" data-f="' + DW.indexOf(d) + '"' + (allOpen(path) ? "" : ' style="display:none"') + '><td class="code" style="padding-left:' + (30 + (depth + 1) * 22) + 'px">' + esc(d.no) + '</td><td class="ttl">' + esc(d.title) + '</td><td class="code">' + esc(d.revs.join(", ")) + "</td><td>" + tys(d.types) + "</td></tr>"); } }
  };
  walk(root, 0, [], []);
  h.push("</table>");
  $("res").innerHTML = list.length ? h.join("") : '<div class="muted" style="padding:24px">' + (DW.length ? "Nothing matches the search." : "No files in this folder.") + "</div>";
  $("sum").innerHTML = DW.length ? DW.length + " drawing(s) &middot; " + nIn + " in the MIDP" + (DW.length - nIn ? ' &middot; <span class="warn">' + (DW.length - nIn) + " not in the MIDP</span>" : "") : "";
}
/* a group's lasting key: the labels down to it */
function gkey(lp, k) { return cfg.by + ":" + lp.concat([k]).join("/"); }
function tys(t) { var h = ""; for (var i = 0; i < t.length; i++) h += '<span class="ty">' + esc(t[i]) + "</span>"; return h; }

/* open / shut a group in place: rows show when every group above them is open */
function setOpen(tr, on) { OPEN[tr.getAttribute("data-k")] = on; tr.getElementsByTagName("span")[0].innerHTML = on ? "&#9660;" : "&#9654;"; }
function refresh() {
  var rows = $("gt") ? $("gt").rows : [], open = {};
  for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-g")) open[rows[i].getAttribute("data-g")] = !!OPEN[rows[i].getAttribute("data-k")] || !!U($("q").value);
  for (var j = 0; j < rows.length; j++) { var a = rows[j].getAttribute("data-a"), ids = a ? a.split(" ") : [], vis = true; for (var k = 0; k < ids.length; k++) if (!open[ids[k]]) { vis = false; break; } rows[j].style.display = vis ? "" : "none"; }
}
$("res").onclick = function (e) { var tr = LT.up((e || window.event).target || (e || window.event).srcElement, "data-g"); if (!tr) return; setOpen(tr, !OPEN[tr.getAttribute("data-k")]); refresh(); };
$("res").ondblclick = function (e) { var tr = LT.up((e || window.event).target || (e || window.event).srcElement, "data-f"); if (tr) try { LT.showInFolder(DW[+tr.getAttribute("data-f")].files[0]); } catch (x) { } };
function all(on) { var rows = $("gt") ? $("gt").rows : []; for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-g")) setOpen(rows[i], on); refresh(); }
$("bOpen").onclick = function () { all(true); }; $("bShut").onclick = function () { all(false); };
$("q").onkeyup = draw;
$("by").onchange = function () { cfg.by = this.value; save(); draw(); };
$("subs").onclick = function () { cfg.subs = this.checked; save(); run(); };
$("bRescan").onclick = run;
$("bFolder").onclick = function () { var f = LT.pickFolder("Pick the folder to group"); if (f) { cfg.folder = f; save(); paths(); LT.folderPicked(f); run(); } };
function look() { LT.applyLook([".num{background:{accent};color:{accText};border-radius:{rc}px}", "#gt tr.lv0 td{background:{accSoft}}#gt tr.lv1 td{background:{panel}}#gt tr.g:hover td{color:{accent}}#gt tr.miss td{background:{warnSoft}}", ".ar{color:{accent}}", ".ty{background:{chip};border-radius:{rc}px}", "#gt td{border-bottom:1px solid {line}}", "#cfTree{border:1px solid {line};border-radius:{r}px;background:{bg}}.cfr input.ch{border-color:{accent};background:{accSoft}}"]); }
/* ---------- copy / move into Tower / Typology / Model folders (names can be changed; kept in cfg.names) ---------- */
var BADC = /[\\\/:*?"<>|\u0000-\u001f]+/g;
function clean(n) { n = LT.trim(("" + n).replace(BADC, "_")).replace(/[. ]+$/, ""); return n || "_"; }
function nameOf(lv, val) { cfg.names = cfg.names || {}; var k = lv + ":" + val, c = cfg.names[k]; return clean(c != null && c !== "" ? c : val); }
function cfList() { var q = U($("q").value), o = []; for (var i = 0; i < DW.length; i++) { var d = DW[i]; if (q && (U(d.no) + " " + U(d.title) + " " + d.tower + " " + d.typo + " " + d.model).indexOf(q) < 0) continue; if (!d.inMidp && !$("cfOth").checked) continue; o.push(d); } return o; }
function filesOf(d) { if ($("cfRev").value != "last" || d.revs.length < 2) return d.files.slice(0); var hi = d.revs[d.revs.length - 1], o = [];
  for (var i = 0; i < d.files.length; i++) { var n = fso.GetFileName(d.files[i]), k = n.lastIndexOf("."), sp = LT.trSplit(k > 0 ? n.substring(0, k) : n); if (!sp.rev || U(sp.rev) == U(hi)) o.push(d.files[i]); } return o; }
/* the folder path of a drawing: [ { lv, val } ... ] */
function cfPath(d) { if (!d.inMidp) return [{ lv: "other", val: LT.trim($("cfOthN").value) || "Others" }]; var L = cfg.by.split(","), o = [];
  for (var i = 0; i < L.length; i++) o.push({ lv: L[i], val: d[L[i]] || "No " + LEVEL[L[i]][0].toLowerCase() }); return o; }
function cfTree() { var list = cfList(), root = { kids: {}, order: [], n: 0, f: 0 };
  for (var i = 0; i < list.length; i++) { var p = cfPath(list[i]), node = root, nf = filesOf(list[i]).length; root.n++; root.f += nf;
    for (var j = 0; j < p.length; j++) { var k = p[j].lv + ":" + p[j].val; if (!node.kids[k]) { node.kids[k] = { lv: p[j].lv, val: p[j].val, kids: {}, order: [], n: 0, f: 0 }; node.order.push(k); } node = node.kids[k]; node.n++; node.f += nf; } }
  var srt = function (n) { n.order.sort(function (a, b) { var oa = n.kids[a].lv == "other", ob = n.kids[b].lv == "other"; if (oa != ob) return oa ? 1 : -1; return natCmp(n.kids[a].val, n.kids[b].val); }); for (var i2 = 0; i2 < n.order.length; i2++) srt(n.kids[n.order[i2]]); }; srt(root);
  var h = [], walk = function (n, dep) { for (var i3 = 0; i3 < n.order.length; i3++) { var x = n.kids[n.order[i3]], ch = cfg.names && cfg.names[x.lv + ":" + x.val];
      h.push('<div class="cfr" style="padding-left:' + dep * 26 + 'px"><span class="cfi">&#128193;</span><input type="text" data-nm="' + esc(x.lv + ":" + x.val) + '" value="' + esc(nameOf(x.lv, x.val)) + '" title="' + esc((LEVEL[x.lv] ? LEVEL[x.lv][0] : "Not in the MIDP") + ": " + x.val + " - type a new name") + '"' + (ch ? ' class="ch"' : "") + '><span class="cnt muted">' + x.n + " drawing" + (x.n == 1 ? "" : "s") + " &middot; " + x.f + " file" + (x.f == 1 ? "" : "s") + "</span></div>"); walk(x, dep + 1); } };
  walk(root, 0);
  $("cfTree").innerHTML = h.join("") || '<div class="muted" style="padding:20px">Nothing to copy.</div>';
  $("cfN").innerHTML = "(" + root.n + " drawings &middot; " + root.f + " files)"; $("cfRun").innerHTML = ($("cfMove").checked ? "&#9654; Move " : "&#9654; Copy ") + root.f + " file" + (root.f == 1 ? "" : "s");
  $("cfRun").disabled = !root.f; return root; }
function cfOpen() { if (!DW.length) { alert("Pick a folder with drawings first."); return; } $("cfBy").innerHTML = esc(cfg.by.split(",").map(function (l) { return LEVEL[l][0]; }).join(" \u203a "));
  $("cfDestL").innerHTML = cfg.cfDest ? esc(cfg.cfDest) : '<span class="muted">not picked</span>'; $("cfOthN").value = cfg.cfOth || "Others"; $("cfMsg").innerHTML = ""; $("cfUndo").style.display = cfg.cfLast && cfg.cfLast.length ? "" : "none";
  $("cf").style.display = "block"; cfTree(); }
function cfRun() {
  var dest = cfg.cfDest, move = $("cfMove").checked, list = cfList(), todo = [], skip = [];
  if (!dest) { alert("Pick the target folder first."); return; }
  if (dest.toLowerCase().indexOf(cfg.folder.toLowerCase() + "\\") == 0 && cfg.subs && !confirm("The target folder is inside the folder you're reading - the copies will show up in it next time. Go on?")) return;
  for (var i = 0; i < list.length; i++) { var p = cfPath(list[i]), dir = dest; for (var j = 0; j < p.length; j++) dir += "\\" + nameOf(p[j].lv, p[j].val); var fs = filesOf(list[i]);
    for (var k = 0; k < fs.length; k++) todo.push({ from: fs[k], dir: dir, to: dir + "\\" + fso.GetFileName(fs[k]) }); }
  if (!todo.length) return;
  if (!confirm((move ? "Move " : "Copy ") + todo.length + " file(s) into " + dest + "?\n\n" + todo.slice(0, 6).map(function (x) { return x.to.substring(dest.length + 1); }).join("\n") + (todo.length > 6 ? "\n..." : "") + (move ? "\n\nMove takes them out of where they are now (Undo puts them back)." : ""))) return;
  var done = [], made = [];
  for (var t = 0; t < todo.length; t++) { var x = todo[t];
    if (x.to.length >= 260) { skip.push(fso.GetFileName(x.from) + " (path too long)"); continue; }
    if (fso.FileExists(x.to)) { skip.push(fso.GetFileName(x.from) + " (already in " + x.to.substring(dest.length + 1, x.to.length - fso.GetFileName(x.to).length - 1) + ")"); continue; }
    try { var dd = x.dir, nw = []; while (dd.length > dest.length && !fso.FolderExists(dd)) { nw.unshift(dd); dd = fso.GetParentFolderName(dd); } LT.mkdirs(x.dir); for (var q = 0; q < nw.length; q++) made.push(nw[q]);
      if (move) fso.MoveFile(x.from, x.to); else fso.CopyFile(x.from, x.to, false); done.push([x.from, x.to]); } catch (e) { skip.push(fso.GetFileName(x.from) + " (" + (e.message || "open in another program?") + ")"); } }
  cfg.cfLast = done; cfg.cfMove = move; cfg.cfMade = made; save();
  $("cfMsg").innerHTML = '<span class="ok">&#10004; ' + done.length + " file(s) " + (move ? "moved" : "copied") + "</span>" + (skip.length ? ' &middot; <span class="warn">' + skip.length + " skipped</span>" : "");
  $("cfUndo").style.display = done.length ? "" : "none";
  if (skip.length) alert("Not " + (move ? "moved" : "copied") + " (" + skip.length + "):\n" + skip.slice(0, 15).join("\n") + (skip.length > 15 ? "\n..." : ""));
  if (done.length) { LT.toast(done.length + " file(s) " + (move ? "moved" : "copied") + " into " + fso.GetFileName(dest)); try { LT.open(dest); } catch (e2) { } }
  if (move) run();
}
function cfUndo() { var L = cfg.cfLast || [], n = 0; if (!L.length) return;
  if (!confirm((cfg.cfMove ? "Move the " + L.length + " file(s) back where they were?" : "Delete the " + L.length + " copied file(s)? (The originals stay.)"))) return;
  for (var i = 0; i < L.length; i++) try { if (!fso.FileExists(L[i][1])) continue; if (cfg.cfMove) { if (!fso.FileExists(L[i][0])) { fso.MoveFile(L[i][1], L[i][0]); n++; } } else { fso.DeleteFile(L[i][1], true); n++; } } catch (e) { }
  var M = (cfg.cfMade || []).slice(0).sort(function (a, b) { return b.length - a.length; }); for (var j = 0; j < M.length; j++) try { var fo = fso.GetFolder(M[j]); if (!fo.Files.Count && !fo.SubFolders.Count) fso.DeleteFolder(M[j], true); } catch (e2) { }
  cfg.cfLast = []; cfg.cfMade = []; save(); $("cfUndo").style.display = "none"; $("cfMsg").innerHTML = n + " file(s) " + (cfg.cfMove ? "moved back" : "removed"); LT.toast("Undone: " + n + " file(s)"); if (cfg.cfMove) run(); }
$("bCopy").onclick = cfOpen; $("cfCancel").onclick = function () { $("cf").style.display = "none"; };
$("cfDest").onclick = function () { var f = LT.pickFolder("Where should the Tower / Typology / Model folders go?"); if (f) { cfg.cfDest = f; save(); $("cfDestL").innerHTML = esc(f); } };
$("cfCopy").onclick = $("cfMove").onclick = $("cfRev").onchange = $("cfOth").onclick = function () { cfTree(); };
$("cfOthN").onchange = function () { cfg.cfOth = LT.trim(this.value) || "Others"; save(); cfTree(); };
$("cfTree").onchange = function (e) { var t = (e || window.event).target || (e || window.event).srcElement, k = t.getAttribute && t.getAttribute("data-nm"); if (k == null) return; cfg.names = cfg.names || {}; var v = LT.trim(t.value), base = k.substring(k.indexOf(":") + 1);
  if (!v || v == base) delete cfg.names[k]; else cfg.names[k] = v; save(); var sc = $("cfTree").scrollTop; cfTree(); $("cfTree").scrollTop = sc; };
$("cfTree").onkeydown = function (e) { e = e || window.event; var t = e.target || e.srcElement; if (e.keyCode == 13 && t.getAttribute && t.getAttribute("data-nm") != null) { t.blur(); if (e.preventDefault) e.preventDefault(); return false; } };
$("cfReset").onclick = function () { if (!confirm("Put every folder name back to its Tower / Typology / Model value?")) return; cfg.names = {}; save(); cfTree(); };
$("cfRun").onclick = cfRun; $("cfUndo").onclick = cfUndo;
window.ltTheme = look; window.ltReload = function () { load(); paths(); run(); };
window.ltReceive = function (what, value) { if (what == "open-folder" && fso.FolderExists(value)) { cfg.folder = value; save(); paths(); run(); } if (what == "copy-into-folders") cfOpen(); };
window.ltGroups = { run: run, draw: draw };   // (tests)
look(); load(); paths(); run(); LT.tabKeys();
</script>
</body>
</html>
