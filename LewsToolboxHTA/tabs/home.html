<!DOCTYPE html>
<html>
<head>
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta charset="utf-8">
<title>Home</title>
<meta name="lt-order" content="0">
<meta name="lt-icon" content="&#127968;">
<meta name="lt-desc" content="Your dashboard: your day, your team, the project's drawings and what went out - each card opens the right place. The weekly report is here too.">
<!--
  Lew's Toolbox - Home (dashboard). Only READS what the other tabs saved (tracker.json, delegate.json, workload.json,
  transmittals.json, the Drawing Register of the project in the top bar, the Launcher list); a task typed here goes to Tasks.
  The weekly report (tabs\parts\report.html) opens inside Home.
-->
<style>
#wrap{height:100%;overflow:auto;padding:22px 26px 30px}
#head{display:flex;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
#hello{font-size:1.65em;font-weight:600;line-height:1.2}
#date{margin-top:3px}
#headR{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap}
#quick{width:340px;max-width:60vw;margin:0 8px 0 0}
#headR .btn{margin:0 0 0 8px}
.kpis{display:flex;flex-wrap:wrap;margin:0 -8px 8px}
.kpi{flex:1 1 180px;min-width:175px;margin:0 8px 16px;padding:16px 18px;cursor:pointer;position:relative;overflow:hidden}
.kpi .t{display:flex;align-items:center;font-size:.85em;font-weight:600}.kpi .t svg{margin-right:8px}
.kpi .v{font-size:2.1em;font-weight:600;line-height:1.1;margin-top:10px}.kpi .v small{font-size:.45em;font-weight:600;margin-left:6px}
.kpi .s{font-size:.85em;margin-top:4px}
.kpi .viz{position:absolute;right:14px;top:14px}.kpi.hv{padding-right:86px}
.grid2{display:flex;flex-wrap:wrap;margin:0 -8px}
.col{flex:1 1 380px;min-width:320px;margin:0 8px}
.box{margin:0 0 16px;padding:16px 18px}
.box h3{display:flex;align-items:center;font-size:1em;font-weight:600;margin-bottom:10px}.box h3 svg{margin-right:8px}.box h3 .n{font-weight:600;margin-left:8px;font-size:.85em;padding:1px 8px;border-radius:99px}
.go{margin-left:auto;font-size:.85em;font-weight:600;cursor:pointer}
.it{display:flex;align-items:flex-start;padding:8px 0;cursor:pointer}.it .dot{flex:none;width:8px;height:8px;border-radius:50%;margin:6px 10px 0 2px}
.it .m{min-width:0;flex:1 1 auto}.it b{font-weight:600}.it .s{font-size:.85em;margin-top:1px}.it .r{flex:none;font-size:.82em;margin-left:10px;white-space:nowrap}
.day{font-weight:700;margin:10px 0 2px;font-size:.75em;text-transform:uppercase;letter-spacing:.6px}
.empty{padding:6px 0}
.bars .br{display:flex;align-items:center;margin:7px 0;cursor:pointer}.bars .nm{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars .tr{flex:1 1 auto;height:9px;border-radius:5px;overflow:hidden;margin:0 10px}.bars .tr i{display:block;height:100%;border-radius:5px}.bars .pc{width:90px;flex:none;text-align:right;font-size:.85em}
.leg{font-size:.82em;margin-top:8px}.leg span{display:inline-block;margin:0 12px 4px 0;white-space:nowrap}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.tile{display:inline-block;width:48%;margin:0 2% 6px 0;padding:6px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
/* hero row: where the work stands + the project card */
.hero{display:flex;flex-wrap:wrap;margin:0 -8px 0}
#stand{flex:2 1 420px;min-width:340px;margin:0 8px 16px;padding:18px 20px}
#heroP{flex:1 1 280px;min-width:260px;margin:0 8px 16px;padding:18px 20px;border-radius:18px;cursor:pointer;position:relative;overflow:hidden}
#stand h3{display:flex;align-items:center;font-size:1.05em;font-weight:600;margin-bottom:4px}#stand h3 svg{margin-right:8px}
.srow{margin:14px 0 0}.srow .sh{display:flex;align-items:baseline;font-size:.9em;margin-bottom:6px}.srow .sh b{font-weight:600}.srow .sh .muted{margin-left:auto;font-size:.92em}
.seg{display:flex;height:30px}.seg i{display:block;height:100%;border-radius:99px;margin-right:4px;width:0;min-width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}.seg i:last-child{margin-right:0}
.seg i span{display:block;font-style:normal;font-size:.78em;font-weight:700;line-height:30px;padding:0 10px;white-space:nowrap;overflow:hidden}
.sleg{font-size:.8em;margin-top:14px}.sleg span{display:inline-block;margin-right:14px;white-space:nowrap}.sleg i{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:6px;vertical-align:-1px}
#heroP .hp{font-size:.85em;font-weight:600;opacity:.8;display:flex;align-items:center}#heroP .hp svg{margin-right:7px}
#heroP .big{font-size:3.1em;font-weight:700;line-height:1;margin:12px 0 2px;letter-spacing:-1px}#heroP .bs{font-size:.88em;opacity:.8}
#heroP .subs{display:flex;margin:16px -4px 0}#heroP .sc{flex:1 1 0;margin:0 4px;padding:9px 10px;border-radius:12px}#heroP .sc b{display:block;font-size:1.35em;font-weight:700}#heroP .sc span{font-size:.75em;opacity:.8}
#heroP .chipL{position:absolute;right:16px;top:16px;font-size:.75em;font-weight:700;padding:4px 10px;border-radius:99px}
#heroP .ring{position:absolute;right:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;opacity:.13}
/* entrance: cards rise in one after the other */
@keyframes ltRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim .rise{animation:ltRise .55s cubic-bezier(.2,.8,.2,1) both}
#repWrap{display:none;position:absolute;left:0;top:0;right:0;bottom:0}#repBar{height:46px;display:flex;align-items:center;padding:0 16px}#repBar b{margin-left:10px}
#repFrame{position:absolute;left:0;top:46px;right:0;bottom:0;width:100%;height:calc(100% - 46px);border:0}
</style>
<script src="../core/lt-core.js"></script>
<script src="../core/lt-transmittal.js"></script>
</head>
<body>
<div id="wrap">
  <div id="head">
    <div><div id="hello"></div><div id="date" class="muted"></div></div>
    <div id="headR"><input type="text" id="quick" placeholder="Add a task...  e.g.  Check RFI drawings fri #Tower1 !"><button class="btn primary" id="bAdd">+ Add</button><button class="btn" id="bRep" title="Your weekly update in one click - ready to paste into an email">&#128202; Weekly report</button></div>
  </div>
  <div id="repReady" class="box rise" style="display:none"></div>
  <div class="hero"><div class="box rise" id="stand"></div><div class="rise" id="heroP" data-go="register" data-view="status"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="col">
      <div class="box"><h3><span id="iToday"></span>Today <span class="n" id="nToday"></span><span class="go" data-go="tracker">Open Tasks &rsaquo;</span></h3><div id="today"></div></div>
      <div class="box"><h3><span id="iNext"></span>Next 2 weeks <span class="n" id="nNext"></span></h3><div id="next"></div></div>
      <div class="box"><h3><span id="iDone"></span>Done in the last 7 days <span class="go" data-go="tracker" data-view="done">Done &rsaquo;</span></h3><div id="done7"></div></div>
    </div>
    <div class="col">
      <div class="box" id="inBox"><h3><span id="iIn"></span>Incoming <span class="n" id="nIn"></span><span class="go" id="inRef" title="Check the folders now">&#8635; Refresh</span><span class="go" id="inAdd" style="margin-left:14px">+ Watch a folder</span></h3><div id="incoming"></div></div>
      <div class="box"><h3><span id="iWait"></span>Waiting on others <span class="n" id="nWait"></span><span class="go" data-go="delegate">Open Delegate &rsaquo;</span></h3><div id="wait"></div></div>
      <div class="box" id="teamBox" style="display:none"><h3><span id="iTeam"></span>Team this week <span class="go" data-go="delegate" data-view="workload">Workload &rsaquo;</span></h3><div id="team" class="bars"></div></div>
      <div class="box"><h3><span id="iTr"></span>Last transmittals <span class="go" data-go="transmittal">History &rsaquo;</span></h3><div id="trs"></div></div>
      <div class="box"><h3><span id="iRec"></span>Recent files <span class="go" data-go="launcher">Launcher &rsaquo;</span></h3><div id="recent"></div></div>
    </div>
  </div>
</div>
<div class="ov" id="inDlg"><div class="card" id="inCard">
  <div style="display:flex;align-items:center;margin-bottom:4px"><h3 style="margin:0 10px 0 0">Incoming</h3><select id="inSel" style="width:220px;margin:0"></select><span style="flex:1 1 auto"></span><button class="btn small" id="inRef2" style="margin:0 6px 0 0" title="Check the folders now">&#8635; Refresh</button><button class="btn small" id="inClose" style="margin:0">Close</button></div>
  <div class="muted" id="inPath" style="margin-bottom:8px"></div>
  <div style="display:flex;align-items:center;flex-wrap:wrap"><span id="inTabs"></span><input type="text" id="inQ" placeholder="Search the list..." style="width:210px;margin:0 0 6px auto"></div>
  <div id="inList"></div>
  <div class="acts"><button class="btn small" id="inCheck" title="Check the new files in Folder Check">Check them in Folder Check</button><button class="btn small" id="inSeen">Mark as seen</button><button class="btn small" id="inOpenF">Open the folder</button><span class="sp"></span><button class="btn small" id="inStop" title="Stop watching this folder">Stop watching</button></div>
</div></div>
<div id="repWrap"><div id="repBar"><button class="btn small" id="repBack" style="margin:0">&lsaquo; Back to Home</button><b>Weekly report</b></div><iframe application="yes" id="repFrame"></iframe></div>
<script>
var $ = LT.$, esc = LT.esc, fso = LT.fso, links = [];
function D(s) { return LT.parseIso(s); }
function todayD() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function daysFrom(iso) { var d = D(iso); return d ? Math.round((d - todayD()) / 864e5) : null; }
function when(iso) { var n = daysFrom(iso); if (n == null) return ""; if (n == 0) return "today"; if (n == 1) return "tomorrow"; if (n < 0) return (-n) + " day" + (n == -1 ? "" : "s") + " late"; return LT.fmtDate(iso); }
function read(name) { try { return LT.readJson(LT.dataPath(name), null); } catch (e) { return null; } }
function link(tab, what, value) { links.push({ tab: tab, what: what, value: value }); return ' data-l="' + (links.length - 1) + '"'; }
function V() { return LT.themeVars(); }

/* ---------- small charts (SVG; work in the HTA's engine) ---------- */
function donut(parts, size, label) {   // parts: [[value, colour]]
  var tot = 0; for (var i = 0; i < parts.length; i++) tot += parts[i][0]; var r = size / 2 - 6, c = 2 * Math.PI * r, off = 0, h = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '">';
  h += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + V().chip + '" stroke-width="9"/>';
  if (tot) for (var j = 0; j < parts.length; j++) { var len = parts[j][0] / tot * c; if (!len) continue;
    h += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + parts[j][1] + '" stroke-width="9" stroke-dasharray="' + len.toFixed(2) + " " + (c - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + size / 2 + " " + size / 2 + ')"/>'; off += len; }
  if (label) h += '<text x="50%" y="54%" text-anchor="middle" font-size="13" font-weight="700" fill="' + V().text + '">' + esc(label) + "</text>";
  return h + "</svg>";
}
function spark(vals, w, hgt, col) {   // little column chart
  var mx = 1; for (var i = 0; i < vals.length; i++) if (vals[i] > mx) mx = vals[i];
  var bw = w / vals.length, h = '<svg width="' + w + '" height="' + hgt + '">';
  for (var j = 0; j < vals.length; j++) { var bh = Math.max(2, Math.round(vals[j] / mx * (hgt - 4))); h += '<rect x="' + (j * bw + 2).toFixed(1) + '" y="' + (hgt - bh) + '" width="' + (bw - 4).toFixed(1) + '" height="' + bh + '" rx="2" fill="' + (vals[j] ? col : V().chip) + '"/>'; }
  return h + "</svg>";
}

/* ---------- Incoming: the card shows counts only; a click opens the list ---------- */
function num(n) { return ("" + n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function inCounts(F) { var c = { add: 0, chg: 0, rem: 0, ex: F.seen ? 0 : -1 }, pd = F.pending || [], k; for (k = 0; k < pd.length; k++) { if (pd[k].kind == "new") c.add++; else if (pd[k].kind == "deleted") c.rem++; else c.chg++; }
  if (F.seen) for (k in F.seen) if (F.seen.hasOwnProperty(k)) c.ex++; return c; }
var inF = 0, inTab = "new", inQ = "";
function openIn(i) { var W = LT.watchLoad(); if (!W.folders.length) return; inF = Math.min(i || 0, W.folders.length - 1); inQ = ""; $("inQ").value = "";
  var c = inCounts(W.folders[inF]); inTab = c.add ? "new" : c.chg ? "changed" : c.rem ? "deleted" : "all"; drawIn(); $("inDlg").style.display = "block"; }
function drawIn() {
  var W = LT.watchLoad(); if (!W.folders.length) { $("inDlg").style.display = "none"; return; } if (inF >= W.folders.length) inF = 0;
  var F = W.folders[inF], c = inCounts(F), v = V(), q = LT.trim(inQ).toLowerCase(), h = "", n = 0, i, o = "";
  for (i = 0; i < W.folders.length; i++) o += '<option value="' + i + '"' + (i == inF ? " selected" : "") + ">" + esc(W.folders[i].name) + "</option>"; $("inSel").innerHTML = o;
  $("inPath").innerHTML = '<span class="mlk" data-open="' + esc(F.path) + '" title="Open the folder">' + esc(F.path) + "</span>" + (F.at ? " &middot; checked " + esc(ago(F.at)) : "");
  var T = [["new", "Added", c.add], ["changed", "Changed", c.chg], ["deleted", "Removed", c.rem], ["all", "All files", c.ex]], t = "";
  for (i = 0; i < T.length; i++) t += '<span class="chip' + (inTab == T[i][0] ? " on" : "") + '" data-intab="' + T[i][0] + '">' + T[i][1] + " " + (T[i][2] < 0 ? "&ndash;" : num(T[i][2])) + "</span>"; $("inTabs").innerHTML = t;
  var dayOf = function (tm) { var d = new Date(tm), t0 = todayD(); d = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var k = Math.round((t0 - d) / 864e5); return k <= 0 ? "Today" : k == 1 ? "Yesterday" : "Earlier"; };
  if (inTab == "all") { var rows = []; if (F.seen) for (var k in F.seen) if (F.seen.hasOwnProperty(k) && (!q || k.toLowerCase().indexOf(q) >= 0)) rows.push(k); rows.sort();
    for (i = 0; i < rows.length && i < 800; i++) { var fn = rows[i].substring(rows[i].lastIndexOf("\\") + 1), sub = rows[i].lastIndexOf("\\") > 0 ? rows[i].substring(0, rows[i].lastIndexOf("\\")) : "";
      h += '<div class="it" data-open="' + esc(F.path + "\\" + rows[i]) + '"><div class="m">' + esc(fn) + (sub ? '<div class="s muted">in ' + esc(sub) + "</div>" : "") + '</div><span class="r muted">' + esc(LT.fmtDate(LT.iso(new Date(F.seen[rows[i]])))) + "</span></div>"; n++; }
    if (rows.length > 800) h += '<div class="muted" style="padding:8px 0">&hellip; showing the first 800 of ' + num(rows.length) + " &ndash; type in the search box to narrow it</div>"; if (!rows.length) h = '<div class="muted" style="padding:16px 0">No file matches.</div>'; }
  else { var pd = F.pending || [], last = ""; for (i = 0; i < pd.length; i++) { var P0 = pd[i], kind = P0.kind == "new" ? "new" : P0.kind == "deleted" ? "deleted" : "changed"; if (kind != inTab || (q && P0.rel.toLowerCase().indexOf(q) < 0)) continue;
      var dy = dayOf(P0.time); if (dy != last) { last = dy; h += '<div class="wday">' + dy + "</div>"; } n++;
      var sb = P0.rel.lastIndexOf("\\") > 0 ? P0.rel.substring(0, P0.rel.lastIndexOf("\\")) : "", f2 = P0.rel.substring(P0.rel.lastIndexOf("\\") + 1);
      h += '<div class="it"' + (kind == "deleted" ? "" : ' data-open="' + esc(P0.path) + '"') + '><span class="dot" style="background:' + (kind == "new" ? v.ok : kind == "deleted" ? v.bad : v.warn) + '"></span><div class="m"' + (kind == "deleted" ? ' style="text-decoration:line-through;opacity:.7"' : "") + ">" + esc(f2) +
        '<div class="s muted">' + (sb ? "in " + esc(sb) : "") + (P0.code ? ' &middot; <span class="ok">&#128279; output of ' + esc(P0.code) + "</span>" : "") + '</div></div><span class="r muted">' + esc(ago(P0.time)) + "</span></div>"; }
    if (!n) h = '<div class="muted" style="padding:16px 0">' + (q ? "No file matches." : inTab == "new" ? "Nothing new." : inTab == "changed" ? "Nothing changed." : "Nothing removed.") + "</div>"; }
  $("inList").innerHTML = h; $("inSeen").style.display = (F.pending || []).length ? "" : "none"; $("inCheck").style.display = (F.pending || []).length ? "" : "none";
}

/* Home only reads files that changed: a stamp of the data files (+ the day, + 5-minute steps for the "x min ago" texts) decides if it must draw again */
var lastSig = "", lastLook = "";
function dataSig() {
  var fs = LT.fso, names = ["tracker.json", "delegate.json", "workload.json", "transmittals.json", "watch.json", "register.json"], o = [], i, p;
  try { var ix = LT.registerIndex(); if (ix.current) names.push("register\\" + ix.current + ".json"); } catch (e) { }
  for (i = 0; i < names.length; i++) { p = LT.dataPath(names[i]); try { if (fs.FileExists(p)) { var f = fs.GetFile(p); o.push(+new Date(f.DateLastModified) + ":" + f.Size); } else o.push("-"); } catch (e) { o.push("?"); } }
  try { var sf = LT.settingsFile(); if (fs.FileExists(sf)) { var g = fs.GetFile(sf); o.push(+new Date(g.DateLastModified) + ":" + g.Size); } } catch (e) { }
  return o.join("|") + "|" + LT.today() + "|" + Math.floor(new Date().getTime() / 300000);
}
function render(force) {
  var sig = dataSig() + "|" + (LT.settings().theme || "") + "|" + (LT.smooth() ? 1 : 0);
  if (force !== true && sig == lastSig && $("kpis").innerHTML) { intro(); return; }   // nothing changed: just show what is there
  lastSig = sig;
  links = []; var v = V();
  var s = LT.settings(), hr = new Date().getHours(), name = (s.userName || "").split(/[ .]/)[0];
  $("hello").innerHTML = (hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening") + (name ? ", " + esc(name.charAt(0).toUpperCase() + name.substring(1)) : "");
  var d0 = new Date(), pj = LT.project(); $("date").innerHTML = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d0.getDay()] + " " + d0.getDate() + " " + LT.MON[d0.getMonth()] + " " + d0.getFullYear() + (pj ? " &middot; " + esc(pj.name) : "");
  var ic = { iIn: "inbox", iToday: "taskcheck", iNext: "calendar", iDone: "ok", iWait: "clock", iTeam: "users", iTr: "transmittal", iRec: "files" }; for (var k0 in ic) if (ic.hasOwnProperty(k0)) $(k0).innerHTML = LT.icon(ic[k0], 18);

  var tr = read("tracker.json") || { tasks: [] }, dl = read("delegate.json") || { tasks: [] }, events = [];
  /* my day */
  var mine = [], late = 0, dueToday = 0;
  for (var i = 0; i < (tr.tasks || []).length; i++) { var t = tr.tasks[i]; if (t.status == "Done") continue; var n = daysFrom(t.due);
    if ((n != null && n <= 0) || t.status == "Doing") mine.push(t); if (n != null && n < 0) late++; if (n === 0) dueToday++;
    if (n != null && n > 0 && n <= 14) events.push({ due: t.due, text: t.title, sub: t.project || "my task", tab: "tracker" }); }
  mine.sort(function (a, b) { return (a.due || "9") < (b.due || "9") ? -1 : 1; });
  var html = "";
  for (var j = 0; j < mine.length && j < 8; j++) { var m = mine[j], lt = daysFrom(m.due) < 0;
    html += '<div class="it"' + link("tracker", "show-task", m.code || "") + '><span class="dot" style="background:' + (lt ? v.bad : m.status == "Doing" ? v.warn : v.accent) + '"></span><div class="m"><b>' + (m.priority == "High" ? '<span class="bad">! </span>' : "") + esc(m.title) + '</b><div class="s muted">' + esc([m.who ? "→ " + m.who : "", m.project, m.status == "Doing" ? "doing" : ""].filter(Boolean).join(" · ")) + '</div></div><span class="r ' + (lt ? "bad" : "muted") + '">' + esc(when(m.due)) + "</span></div>"; }
  if (mine.length > 8) html += '<div class="muted s">&hellip; and ' + (mine.length - 8) + " more</div>";
  $("today").innerHTML = html || '<div class="empty muted">Nothing due today &ndash; add one at the top.</div>';
  $("nToday").innerHTML = mine.length || "";
  /* waiting on others */
  var wait = [], wLate = 0, people = {};
  for (var k = 0; k < (dl.tasks || []).length; k++) { var t2 = dl.tasks[k], items = t2.subs && t2.subs.length ? t2.subs : [t2];
    for (var q = 0; q < items.length; q++) { var it = items[q]; if (it.status == "Completed") continue; var due = it.due || t2.due, who = it.who || t2.who; if (!who) continue;
      wait.push({ code: it.code, task: t2.code, title: (items === t2.subs ? t2.title + " – " : "") + it.title, who: who, due: due, status: it.status });
      var nd = daysFrom(due); if (nd != null && nd < 0) { wLate++; people[who] = (people[who] || 0) + 1; } if (nd != null && nd >= 0 && nd <= 14) events.push({ due: due, text: it.code + " " + it.title, sub: "from " + who, tab: "delegate" }); } }
  wait.sort(function (a, b) { var x = daysFrom(a.due), y = daysFrom(b.due); x = x == null ? 999 : x; y = y == null ? 999 : y; return x - y; });

$("inCheck").onclick = function () { var F = LT.watchLoad().folders[inF]; if (F && LT.main()) { $("inDlg").style.display = "none"; LT.main().send("check", "check-folder", F.path); } };
$("inOpenF").onclick = function () { var F = LT.watchLoad().folders[inF]; if (F) try { LT.open(F.path); } catch (er) { } };
$("inStop").onclick = function () { var W = LT.watchLoad(), F = W.folders[inF]; if (F && confirm('Stop watching "' + F.name + '"?')) { W.folders.splice(inF, 1); LT.watchSave(W); inF = 0; render(true); drawIn(); try { LT.main().bell(); } catch (er) { } } };
$("inRef2").onclick = function () { try { if (LT.main()) LT.main().background(); else LT.watchScan(); } catch (er) { } window.setTimeout(function () { render(true); drawIn(); }, 700); };
