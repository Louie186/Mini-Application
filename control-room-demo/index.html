<title>BIM Control Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-height stage. 3D office on the left, team cards + approvals + activity log in a right column. Stacks on phones. */
:root {
  --bg: #f1eee8;
  --panel: #faf8f4;
  --fg: #24211c;
  --muted: #6b665d;
  --line: #ddd7ca;
  --blue: #2f5bd6;
  --violet: #7c4dff;
  --teal: #0b8a96;
  --work: #2f5bd6;
  --ok: #2b8a3e;
  --bad: #d63a2f;
  --warn: #b86e00;
  --scene-bg: #e7e2d6;
  --floor: #d5ceBF;
  --grid: #c3bba9;
  --wall: #efe9dc;
  --desk: #bfae8f;
  --prop: #f7f4ee;
  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1c1f26; --fg: #ece8df; --muted: #9d988c; --line: #2f333c;
    --blue: #7b9bff; --violet: #a78bff; --teal: #3cc4d1; --work: #7b9bff;
    --ok: #5fd07a; --bad: #ff7a70; --warn: #f2b04a;
    --scene-bg: #101218; --floor: #2a2c33; --grid: #3a3d46; --wall: #22252d; --desk: #4b4438; --prop: #dcd9d2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --panel: #1c1f26; --fg: #ece8df; --muted: #9d988c; --line: #2f333c;
  --blue: #7b9bff; --violet: #a78bff; --teal: #3cc4d1; --work: #7b9bff;
  --ok: #5fd07a; --bad: #ff7a70; --warn: #f2b04a;
  --scene-bg: #101218; --floor: #2a2c33; --grid: #3a3d46; --wall: #22252d; --desk: #4b4438; --prop: #dcd9d2;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); }
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
.app { height: 100%; min-height: 560px; display: grid; grid-template-rows: auto minmax(0, 1fr); }

header {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { margin: 0; font: 700 18px/1.2 var(--font-head); letter-spacing: .01em; }
.badge { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
select, button.btn { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button.btn:hover, select:hover { border-color: var(--muted); }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
:root[data-theme="dark"] button.primary { color: #0d1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0d1020; } }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 350px; min-height: 0; }
.view { position: relative; min-height: 0; min-width: 0; background: var(--scene-bg); }
canvas#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#c:active { cursor: grabbing; }
.hud {
  position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
}
.chip { background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; display: flex; gap: 8px; align-items: baseline; }
.chip span { font: 500 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.chip b { font: 700 16px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.chip.ok b { color: var(--ok); } .chip.bad b { color: var(--bad); } .chip.warn b { color: var(--warn); }
.hint { position: absolute; left: 12px; bottom: 10px; margin: 0; font: 400 11px/1.3 var(--font-mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
#fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; margin: 0; color: var(--muted); }

aside {
  min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h2 { margin: 0 0 8px; font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.cards { display: grid; gap: 8px; }
.card {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer;
}
.card[aria-pressed="true"] { border-color: var(--accent, var(--blue)); box-shadow: 0 0 0 1px var(--accent, var(--blue)) inset; }
.card .num { grid-row: 1 / span 3; font: 700 30px/1 var(--font-head); color: var(--accent, var(--blue)); font-variant-numeric: tabular-nums; }
.card .who b { font: 700 15px/1.2 var(--font-head); } .card .who i { font-style: normal; color: var(--muted); margin-left: 6px; font-size: 12px; }
.pill { font: 500 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill[data-s="idle"], .pill[data-s="standby"] { color: var(--muted); }
.pill[data-s="working"] { color: var(--work); }
.pill[data-s="waiting"] { color: var(--warn); }
.pill[data-s="done"] { color: var(--ok); }
.card .task { grid-column: 2 / span 2; color: var(--fg); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.bar { grid-column: 2 / span 2; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent, var(--blue)); transition: width .25s; }

#approve { border: 1px solid var(--warn); border-radius: 8px; padding: 12px; display: grid; gap: 8px; background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
#approve b { font: 700 14px/1.3 var(--font-head); }
#approve p { margin: 0; color: var(--muted); font-size: 12.5px; }
#approve button { justify-self: start; }

.detail dl { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 12.5px; }
.detail dt { color: var(--muted); } .detail dd { margin: 0; overflow-wrap: anywhere; }
.detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font: 400 11.5px/1.3 var(--font-mono); }
.detail h3 { margin: 0 0 10px; font: 700 15px/1.2 var(--font-head); }

#log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font: 400 11.5px/1.4 var(--font-mono); max-height: 230px; overflow-y: auto; }
#log li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; }
#log time { color: var(--muted); }
#log .bad { color: var(--bad); } #log .ok { color: var(--ok); } #log .warn { color: var(--warn); }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(320px, 52%) minmax(0, 1fr); }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .chip b { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<div class="app">
  <header>
    <div class="brand"><h1>BIM Control Room</h1><span class="badge">Demo data</span></div>
    <div class="controls">
      <label for="speed">Speed
        <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
      </label>
      <button class="btn" id="btnView" type="button">Reset view</button>
      <button class="btn primary" id="btnRestart" type="button">Restart demo</button>
    </div>
  </header>
  <div class="stage">
    <div class="view" id="view">
      <canvas id="c" role="img" aria-label="3D office with three robot staff: Lew the manager, Carl the analyzer and Louie the filer, moving drawing sheets from Incoming to Submission"></canvas>
      <div class="hud" id="hud">
        <div class="chip"><span>Submitted</span><b id="nSub">0</b></div>
        <div class="chip ok"><span>Passed</span><b id="nPass">0</b></div>
        <div class="chip bad"><span>Failed</span><b id="nFail">0</b></div>
        <div class="chip warn"><span>Unsure</span><b id="nUns">0</b></div>
        <div class="chip"><span>Log rows</span><b id="nLog">0</b></div>
      </div>
      <p class="hint">Drag to orbit · scroll or pinch to zoom · click a robot</p>
      <p id="fallback" hidden>The 3D view could not start in this browser. The team cards and activity log still run the demo.</p>
    </div>
    <aside>
      <section>
        <h2>The team</h2>
        <div class="cards" id="cards"></div>
      </section>
      <section id="approve" hidden>
        <b id="apTitle"></b>
        <p id="apBody"></p>
        <button class="btn primary" id="apBtn" type="button">Approve</button>
      </section>
      <section class="detail" id="detail"></section>
      <section>
        <h2>Activity</h2>
        <ol id="log"></ol>
      </section>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

  /* ---------- demo data (all invented, for illustration only) ---------- */
  var SHEETS = [

    carl:  { key: 'carl',  num: '02', name: 'Carl',  role: 'Analyzer', tokName: '--violet', pos: [-3, 0, 2],
             files: ['wiki/checklists/standard.md', 'wiki/clients/client-a.md', 'scripts/match_list.py'] },
    louie: { key: 'louie', num: '03', name: 'Louie', role: 'Filer',    tokName: '--teal',   pos: [3, 0, 2],
             files: ['wiki/naming-rules.md', 'log.xlsx', 'raw/history notes'] }
  };
  var ORDER = ['lew', 'carl', 'louie'];
  var STATUS = {
    idle:    { label: 'Idle',            tok: '--muted' },
    standby: { label: 'Standing by',     tok: '--muted' },
    working: { label: 'Working',         tok: '--work' },
    waiting: { label: 'Needs your OK',   tok: '--warn' },

  ORDER.forEach(function (k) {

  });

  var speed = 1, runId = 0, selected = 'carl', startTime = Date.now();

  /* ---------- UI (cards, detail, log, hud) ---------- */
  var cardsEl = $('cards');
  ORDER.forEach(function (k) {
    var a = AGENTS[k];
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.dataset.agent = k; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="num"></span><span class="who"><b></b><i></i></span><span class="pill"></span><span class="task"></span><span class="bar"><span></span></span>';
    b.querySelector('.num').textContent = a.num;
    b.querySelector('b').textContent = a.name;
    b.querySelector('i').textContent = a.role;
    b.addEventListener('click', function () { selectAgent(k, true); });

    a.card = b;
  });
  function refreshCardColors() { ORDER.forEach(function (k) { AGENTS[k].card.style.setProperty('--accent', tok(AGENTS[k].tokName)); }); }

  function renderUI() {

    row('Right now', s.task);
    row('Step', s.step);
    row('Progress', s.progress ? s.progress.done + ' of ' + s.progress.total + ' ' + s.progress.unit : '—');
    row('Last result', s.last);
    var ul = document.createElement('ul'); s.files.forEach(function (f) { var li = document.createElement('li'); li.textContent = f; ul.appendChild(li); });
    row('Brain files (example)', ul);
    d.appendChild(dl);
    $('nSub').textContent = counts.sub; $('nPass').textContent = counts.pass; $('nFail').textContent = counts.fail; $('nUns').textContent = counts.uns; $('nLog').textContent = counts.log;
    holos.forEach(function (h2) { h2.draw(); });
  }
  function setAgent(k, patch) { Object.assign(AGENTS[k], patch); renderUI(); }
  function log(who, text, cls) {
    var li = document.createElement('li'), t = document.createElement('time'), s = document.createElement('span');
    var sec = Math.floor((Date.now() - startTime) / 1000);
    t.textContent = ('0' + Math.floor(sec / 60)).slice(-2) + ':' + ('0' + (sec % 60)).slice(-2);
    s.textContent = who + ': ' + text; if (cls) s.className = cls;

  }

  /* ---------- 3D scene ---------- */
  var THREE = window.THREE, ok3d = !!(THREE && THREE.OrbitControls), renderer, scene, camera, controls, clock;
  var holos = [], signs = [], billboards = [], robots = {}, sheets = [], tweens = [], pickables = [], themeMats = {}, themeCols = { warn: '#b86e00', ok: '#2b8a3e' }, gridHelper;

  function canvasTex(w, h) {

    var t = new THREE.CanvasTexture(c); t.anisotropy = 4;

  }
  function box(w, h, d, mat) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }

  function makeSign(text, w, h) {
    var ct = canvasTex(512, Math.round(512 * h / w));
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: ct.t, transparent: true, depthWrite: false }));
    var o = { mesh: m, draw: function () {
      var c = ct.ctx, W = ct.c.width, H = ct.c.height;
      c.clearRect(0, 0, W, H); c.fillStyle = tok('--panel'); c.globalAlpha = .94; roundRect(c, 4, 4, W - 8, H - 8, 18); c.fill(); c.globalAlpha = 1;
      c.strokeStyle = tok('--line'); c.lineWidth = 3; c.stroke();
      c.fillStyle = tok('--fg'); c.font = '600 ' + Math.round(H * .42) + 'px "Space Grotesk", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

  }

  function makeHolo(a) {
    var ct = canvasTex(640, 400);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.0), new THREE.MeshBasicMaterial({ map: ct.t, transparent: true, depthWrite: false }));
    m.userData.agent = a.key;
    var o = { mesh: m, draw: function () {

      c.fillStyle = col; c.font = '700 120px "Space Grotesk", sans-serif'; c.fillText(a.num, 34, 140);
      c.fillStyle = tok('--fg'); c.font = '700 54px "Space Grotesk", sans-serif'; c.fillText(a.name, 190, 94);
      c.fillStyle = tok('--muted'); c.font = '500 28px "IBM Plex Mono", monospace'; c.fillText(a.role.toUpperCase(), 190, 132);
      var pc = tok(st.tok); c.font = '500 28px "IBM Plex Mono", monospace';
      var tw = c.measureText(st.label).width + 44;
      c.strokeStyle = pc; c.lineWidth = 3; roundRect(c, W - tw - 30, 40, tw, 48, 24); c.stroke();
      c.fillStyle = pc; c.beginPath(); c.arc(W - tw - 30 + 22, 64, 7, 0, 6.3); c.fill(); c.fillText(st.label, W - tw - 30 + 36, 74);
      c.fillStyle = tok('--fg'); c.font = '500 33px "Inter", sans-serif';
      wrapText(c, a.task, 34, 214, W - 68, 42, 3);
      var bx = 34, by = H - 56, bw = W - 68;
      c.fillStyle = tok('--line'); roundRect(c, bx, by, bw, 16, 8); c.fill();
      if (a.progress) { c.fillStyle = col; roundRect(c, bx, by, Math.max(16, bw * a.progress.done / a.progress.total), 16, 8); c.fill(); }
      ct.t.needsUpdate = true;
    } };
    holos.push(o); billboards.push(m); return m;
  }

  function makeRobot(a) {
    var col = new THREE.Color(tok(a.tokName));
    var g = new THREE.Group(), rig = new THREE.Group(); g.add(rig);
    var bodyM = new THREE.MeshStandardMaterial({ color: tok('--prop'), roughness: .55, metalness: .1 });
    var darkM = new THREE.MeshStandardMaterial({ color: 0x23262d, roughness: .4 });
    var accM = new THREE.MeshStandardMaterial({ color: col, roughness: .45, emissive: col, emissiveIntensity: .18 });
    var eyeM = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: col, emissiveIntensity: 1.3 });
    themeMats.prop = themeMats.prop || []; themeMats.prop.push(bodyM);
    var base = box(.95, .18, .95, accM); base.geometry = new THREE.CylinderGeometry(.48, .55, .18, 28); base.position.y = .09; rig.add(base);
    var torso = box(.86, .9, .62, bodyM); torso.position.y = .68; rig.add(torso);
    var panel = box(.5, .3, .04, accM); panel.position.set(0, .74, .32); rig.add(panel);
    var head = new THREE.Group(); head.position.y = 1.48; rig.add(head);
    var skull = box(.82, .6, .64, bodyM); head.add(skull);

    setAgent('carl', { status: 'idle' }); setAgent('louie', { status: 'idle' });
  }
  function startDemo() { demo().catch(function (e) { if (e !== 'stale') console.error(e); }); }

  /* ---------- wiring ---------- */
  $('speed').addEventListener('change', function (e) { speed = parseFloat(e.target.value) || 1; });
  $('btnRestart').addEventListener('click', startDemo);
  $('btnView').addEventListener('click', function () { if (ok3d) homeView(false); });
  refreshCardColors(); renderUI();
  if (ok3d) {
    try { buildScene(); } catch (e) { ok3d = false; console.error(e); }
  }
  if (!ok3d) {
    $('fallback').hidden = false;
    SHEETS.forEach(function (d) { sheets.push({ id: d.id, title: d.title, setStatus: function () {}, mesh: { position: { clone: function () { return { x: 0, y: 0, z: 0 }; }, set: function () {} }, rotation: { y: 0 } } }); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { renderUI(); if (ok3d) { redrawAll(); sheets.forEach(function (s) { s.draw(); }); } });
  startDemo();
})();
</script>
