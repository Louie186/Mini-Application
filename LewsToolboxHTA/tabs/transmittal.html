<!DOCTYPE html>
<html>
<head>
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta charset="utf-8">
<title>Transmittal</title>
<meta name="lt-order" content="4">
<meta name="lt-group" content="Work">
<meta name="lt-icon" content="&#128232;">
<meta name="lt-desc" content="Makes a numbered transmittal sheet (TR-001, TR-002...) in Excel for the documents you issue, and keeps a log of everything sent.">
<!--
  Lew's Toolbox - Transmittal maker: an issue sheet (Excel, or CSV without Excel) from picked files, a pasted list,
  or the "Found" files of Folder Check (Submission check view). Numbers itself (TR-001...), keeps a log, can copy the files into a
  transmittal folder. Data: transmittals.json (the Weekly report reads it).
-->
<style>
#app{display:flex;flex-direction:column;height:100%}
.step{flex:none;padding:10px 14px 4px}
#docs{flex:1 1 auto;overflow:auto;min-height:0}
.num{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;font-weight:bold;margin:0 8px 6px 0;vertical-align:middle}
.lbl{display:inline-block;margin:0 8px 6px 0;vertical-align:middle}
.big{font-weight:bold}
#head .fld{display:inline-block;width:230px;margin:0 10px 6px 0;vertical-align:top}
#head .fld.w{width:470px}
#docs input{width:100%;height:26px}
#docs td{padding:2px 4px}
.right{float:right}
</style>
<script src="../core/lt-core.js"></script>
<script src="../core/lt-transmittal.js"></script>
</head>
<body>
<div id="app">
  <div class="step" id="tvBar" style="padding-bottom:0"><button class="btn on" data-tv="new">&#9993; New transmittal</button><button class="btn" data-tv="hist">&#128220; History <span id="hN"></span></button></div>
  <div id="hist" style="display:none;flex:1 1 auto;min-height:0;flex-direction:column">
    <div class="step bar"><input type="text" id="hQ" placeholder="Search: a drawing number, TR-005, a company, a word in the notes..." style="width:420px;margin:0 8px 6px 0">
      <select id="hPk" style="width:150px;height:26px;margin:0 8px 6px 0"><option value="">Every package</option><option value="log">&#128221; Log only</option><option value="zip">&#128230; Zip</option><option value="folder">&#128193; Folder</option></select>
      <span class="lbl muted" id="hInfo"></span><span class="right"><button class="btn small" id="hCsv">Export (CSV)</button></span></div>
    <div id="hRes" style="flex:1 1 auto;overflow:auto;min-height:0"></div>
  </div>
  <div class="step bar" id="head">
    <span class="num">1</span><span class="lbl big" id="noLbl"></span><span class="lbl muted" id="dateLbl"></span><span class="right"><button class="btn small" id="bLog">Sent log &#9662;</button><button class="btn small" id="bNew">New transmittal</button></span><br>
    <div class="fld"><label>Project</label><input type="text" id="hProj"></div>
    <div class="fld"><label>To (company)</label><input type="text" id="hTo" list="toList"></div>
    <div class="fld"><label>Attention (person)</label><input type="text" id="hAttn"></div>
    <div class="fld"><label>Purpose of issue</label><select id="hPurp"><option>For information</option><option>For action</option><option>For comment</option><option>For review and approval</option><option>For coordination</option><option>For tender</option><option>For construction</option><option>As built</option></select></div>
    <div class="fld w"><label>Notes</label><input type="text" id="hNotes" placeholder="optional"></div>
  </div>
  <div class="step">
    <span class="num">2</span><span class="lbl big">Documents</span>
    <button class="btn" id="bFolder">+ From a folder...</button><button class="btn" id="bPaste">+ Paste a list...</button><button class="btn" id="bTitles">Fill titles from my list</button>
    <span class="lbl muted" id="cnt"></span>
  </div>
  <div id="docs"></div>
  <div class="step bar" style="border-top-width:1px;border-top-style:solid">
    <span class="num">3</span><button class="btn primary" id="bMake">&#128232; Make the transmittal</button>
    <label class="lbl"><input type="checkbox" id="copyFiles" style="height:auto"> also copy the files into a transmittal folder</label>
    <label class="lbl" title="One zip with the transmittal sheet and each file once, made straight from where the files are - nothing copied, nothing doubled"><input type="checkbox" id="zipFiles" style="height:auto"> or one zip to send</label>
    <span class="lbl muted" id="outLbl"></span>
  </div>
</div>
<datalist id="toList"></datalist>
<script>
var $ = LT.$, esc = LT.esc, fso = LT.fso, store, docs = [];
function load() { store = LT.trLoad(); }
function save() { try { LT.trSave(store); } catch (e) { alert("Couldn't save the transmittal log."); } }
function no(n) { return LT.trNo(store, n); }
function split(stem) { return LT.trSplit(stem); }
function header() {
  $("noLbl").innerHTML = "Transmittal " + esc(no(store.next)); var d = new Date(); $("dateLbl").innerHTML = d.getDate() + " " + LT.MON[d.getMonth()] + " " + d.getFullYear();
  if (!$("hProj").value) $("hProj").value = store.project;
  var seen = {}, h = ""; for (var i = store.log.length - 1; i >= 0; i--) { var t = store.log[i].to; if (t && !seen[t]) { seen[t] = 1; h += '<option value="' + esc(t) + '">'; } } $("toList").innerHTML = h;
  $("outLbl").innerHTML = $("copyFiles").checked ? "&rarr; " + esc(outDir()) : "";
}
function outDir() { return LT.trDir(store, no(store.next)); }

/* ---------- documents ---------- */
/* adds files, one row per drawing + revision, with all its file types */
function addFiles(paths) {
  var added = 0;
  for (var i = 0; i < paths.length; i++) { var p = paths[i], n = fso.GetFileName(p), k = n.lastIndexOf("."), ext = k > 0 ? n.substring(k + 1).toLowerCase() : "", s = split(k > 0 ? n.substring(0, k) : n), row = null;
    for (var j = 0; j < docs.length; j++) if (docs[j].number.toUpperCase() == s.base.toUpperCase() && docs[j].rev.toUpperCase() == s.rev) row = docs[j];
    if (!row) { row = { number: s.base, title: "", rev: s.rev, types: [], files: [] }; docs.push(row); added++; }
    if (ext && row.types.indexOf(ext) < 0) row.types.push(ext); if (row.files.indexOf(p) < 0) row.files.push(p); }
  docs.sort(function (a, b) { return a.number.toUpperCase() < b.number.toUpperCase() ? -1 : 1; });
  render(); return added;
}
function fromFolder() {
  var d = LT.pickFolder("Pick the folder with the files to issue"); if (!d) return;
  var list = [], walk = function (dir) { var fo = fso.GetFolder(dir), e = new Enumerator(fo.Files); for (; !e.atEnd(); e.moveNext()) { var f = e.item(); if (!(f.Attributes & 6) && !/^~\$|^thumbs\.db$|^desktop\.ini$/i.test("" + f.Name)) list.push("" + f.Path); }
    var s = new Enumerator(fo.SubFolders); for (; !s.atEnd(); s.moveNext()) if (!(s.item().Attributes & 6)) walk("" + s.item().Path); };
  try { walk(d); } catch (e) { alert("Couldn't read that folder."); return; }
  var n = addFiles(list); LT.toast(n + " document(s) added"); fillTitles(true);
}
function pasteList() {
  var t = prompt("Paste drawing numbers, one per line (or separated by ;).\nYou can add the revision after a tab or space, e.g.\n5013-KEO-ZZ-DR-A-10101  P02", ""); if (!t) return;
  var ls = t.split(/\r?\n|;/);
  for (var i = 0; i < ls.length; i++) { var l = LT.trim(ls[i]); if (!l) continue; var p = l.split(/\t|\s{2,}|\s(?=[A-Z]{1,2}\d{1,3}$)/), num = LT.trim(p[0]).replace(/\.[a-z0-9]{2,4}$/i, ""), rev = LT.trim(p[1] || ""), s = split(num);
    if (!rev && s.rev) { num = s.base; rev = s.rev; } docs.push({ number: num, title: LT.trim(p[2] || ""), rev: rev.toUpperCase(), types: [], files: [] }); }
  render(); fillTitles(true);
}
/* titles from the list Folder Check (Submission check view) uses (check.json) */
function fillTitles(quiet) {
  var c = LT.readJson(LT.dataPath("check.json"), null);
  if (!c || !c.list || !fso.FileExists(c.list) || !c.colTitle) { if (!quiet) alert("Set up your list in Folder Check (Submission check view) first (with its Title column) - titles are taken from there."); return; }
  var need = false; for (var i = 0; i < docs.length; i++) if (!docs[i].title) need = true; if (!need) { if (!quiet) LT.toast("All documents already have a title"); return; }
  if (quiet && /\.(xlsx|xlsm|xls)$/i.test(c.list)) return;     // reading Excel takes a moment - only when asked
  var L; try { L = LT.readList(c.list, c.sheet); } catch (e) { if (!quiet) alert("Couldn't read the list - is it open in Excel?"); return; }
  var t = L.table, cn = L.head.indexOf(c.colName), ct = L.head.indexOf(c.colTitle);
  if (cn < 0 || ct < 0) { if (!quiet) alert("Couldn't find the columns " + c.colName + " / " + c.colTitle + " in the list."); return; }
  var map = {}; for (var k = L.headRow + 1; k < t.length; k++) { var nm = split(LT.cell(t[k], cn).replace(/\.[a-z0-9]{2,4}$/i, "")).base.toUpperCase(); if (nm) map[nm] = LT.cell(t[k], ct); }
  var n = 0; for (var d = 0; d < docs.length; d++) if (!docs[d].title && map[docs[d].number.toUpperCase()]) { docs[d].title = map[docs[d].number.toUpperCase()]; n++; }
  render(); if (n || !quiet) LT.toast(n + " title(s) filled from your list");
}
function render() {
  var h = ['<table class="grid nonum"><tr><th style="width:40px">No.</th><th>Drawing / document number</th><th>Title</th><th style="width:70px">Rev</th><th style="width:110px">Format</th>' + (LT.dwgOn() ? '<th class="ti" title="Tower · Typology · Model (Drawing Register)">Twr &middot; Typo &middot; Model</th>' : "") + '<th style="width:260px">Revision check</th><th style="width:30px"></th></tr>'], iss = LT.trIssued(store), nBad = 0;
  for (var i = 0; i < docs.length; i++) { var d = docs[i], rc = LT.revCheck(iss, d.number, d.rev, d.files); d.check = rc; if (rc.level == "bad") nBad++;
    h.push("<tr><td>" + (i + 1) + '</td><td><input type="text" data-i="' + i + '" data-k="number" value="' + esc(d.number) + '"></td><td><input type="text" data-i="' + i + '" data-k="title" value="' + esc(d.title) + '"></td><td><input type="text" data-i="' + i + '" data-k="rev" value="' + esc(d.rev) + '"></td><td><input type="text" data-i="' + i + '" data-k="types" value="' + esc(d.types.join(", ")) + '"></td>' + LT.dwgCell(d.number) + '<td class="rc ' + rc.level + '">' + esc(rc.text) + '</td><td><button class="btn small" data-rm="' + i + '" style="margin:0">&#10005;</button></td></tr>'); }
  h.push("</table>");
  $("docs").innerHTML = docs.length ? h.join("") : '<div class="muted" style="padding:24px;line-height:1.8">Add the documents: <b>From a folder</b>, <b>Paste a list</b>, or in <b>Folder Check</b> (Submission check) use <b>Report &#9662; &gt; Make a transmittal</b>. Delegating a task in <b>Delegate</b> makes one by itself.<br>Titles can be filled from your list (the one set up in Folder Check).</div>';
  $("cnt").innerHTML = docs.length ? docs.length + " document(s)" + (nBad ? ' &middot; <span class="bad">&#9888; ' + nBad + " revision problem" + (nBad > 1 ? "s" : "") + "</span>" : "") : "";
}

/* ---------- make it ---------- */
function make() {
  if (!docs.length) { alert("Add the documents first."); return; }
  if (!LT.trim($("hTo").value) && !confirm("No recipient (To) - make it anyway?")) return;
  var bad = []; for (var b = 0; b < docs.length; b++) if (docs[b].check && docs[b].check.level == "bad") bad.push(docs[b].number + " " + docs[b].rev + ": " + docs[b].check.text.replace(/^\u26a0 /, ""));
  if (bad.length && !confirm("Revision check - " + bad.length + " problem(s):\n\n" + bad.slice(0, 12).join("\n") + (bad.length > 12 ? "\n..." : "") + "\n\nMake the transmittal anyway?")) return;
  var t = { project: LT.trim($("hProj").value), to: LT.trim($("hTo").value), attn: LT.trim($("hAttn").value), purpose: $("hPurp").value, notes: LT.trim($("hNotes").value), items: [] };
  for (var i = 0; i < docs.length; i++) t.items.push({ number: docs[i].number, title: docs[i].title, rev: docs[i].rev, types: docs[i].types.join(", "), files: docs[i].files });
  var r; try { r = LT.trMake(t, { copy: $("copyFiles").checked && !$("zipFiles").checked, zip: $("zipFiles").checked }); } catch (e) { alert("Couldn't make the transmittal:\n" + (e.message || e)); return; }
  if (t.csv) LT.toast("Excel isn't available - saved as CSV");
  load();
  try { LT.open(r.dir); } catch (e) { }
  alert(r.no + " is ready:\n" + fso.GetFileName(r.file) + (r.copied ? "\n\n" + r.copied + " file(s) copied into the transmittal folder." : "") + (r.errors.length ? "\n\nNot copied (" + r.errors.length + "):\n" + r.errors.slice(0, 10).join("\n") : "") + "\n\nThe next one will be " + no(store.next) + ".");
  docs = []; $("hNotes").value = ""; header(); render();
}
function logMenu(x, y) {
  var m = [];
  for (var i = store.log.length - 1; i >= 0 && m.length < 15; i--) (function (t) { m.push({ label: esc(t.no) + " &nbsp; " + esc(t.date) + " &nbsp; " + esc(t.to || "(no recipient)") + " &nbsp; <span class=\"muted\">" + t.items.length + " doc(s)</span>", fn: function () { logEntry(t); } }); })(store.log[i]);
  if (!m.length) m.push({ label: "No transmittals yet", fn: function () { } });
  m.push("-", { label: "Numbering: " + esc(store.prefix) + " / next " + esc(no(store.next)) + "...", fn: function () { var p = prompt("Number prefix (e.g. TR-  or  5013-TR-):", store.prefix); if (p == null) return; var n = parseInt(prompt("Next number:", "" + store.next), 10); store.prefix = p; if (n > 0) store.next = n; save(); header(); } },
    { label: "Transmittal folder" + (store.out ? ": " + esc(store.out) : " (exports\\Transmittals)") + "...", fn: function () { var f = LT.pickFolder("Where should transmittals be saved? (e.g. 06 OUTGOING\\Transmittals)"); if (f) { store.out = f; save(); header(); } } },
    { label: "Export the log (CSV)", fn: function () { var t = [["No.", "Date", "Project", "To", "Attention", "Purpose", "Documents"]]; for (var i = 0; i < store.log.length; i++) { var e = store.log[i], n = []; for (var k = 0; k < e.items.length; k++) n.push(e.items[k].number + (e.items[k].rev ? " " + e.items[k].rev : "")); t.push([e.no, e.date, e.project, e.to, e.attn, e.purpose, n.join("; ")]); } var f = LT.exportsDir() + "\\Transmittal_log_" + LT.stamp() + ".csv"; LT.writeCsv(f, t); LT.open(f); } });
  LT.menu(x, y, m);
}
function logEntry(t) {
  LT.menu(200, 120, [{ label: "Open " + esc(t.no) + " file", fn: function () { try { LT.open(t.file); } catch (e) { alert("The file has moved."); } } },
    { label: "Use these documents again (new transmittal)", fn: function () { docs = []; for (var i = 0; i < t.items.length; i++) docs.push({ number: t.items[i].number, title: t.items[i].title, rev: t.items[i].rev, types: t.items[i].types ? t.items[i].types.split(/,\s*/) : [], files: t.items[i].files || [] });
      $("hTo").value = t.to; $("hAttn").value = t.attn; $("hProj").value = t.project; $("hPurp").value = t.purpose; render(); } }]);
}
$("bFolder").onclick = fromFolder; $("bPaste").onclick = pasteList; $("bTitles").onclick = function () { fillTitles(false); };
$("bMake").onclick = make; $("copyFiles").onclick = function () { if (this.checked) $("zipFiles").checked = false; header(); }; $("zipFiles").onclick = function () { if (this.checked) $("copyFiles").checked = false; header(); };
/* ---------- History: everything that went out ---------- */
var hOpen = {};
function pkIcon(t) { var p = t.package || (t.dir && t.copied ? "folder" : "log"); return p == "zip" ? "&#128230; Zip" : p == "folder" ? "&#128193; Folder" : "&#128221; Log only"; }
function histView() {
  load(); var q = LT.trim($("hQ").value).toLowerCase(), pk = $("hPk").value, h = ['<table class="grid"><tr><th>TR</th><th>Date</th><th>To</th><th>Purpose</th><th>Items</th><th>Package</th><th>From</th><th></th></tr>'], n = 0, hitItems = 0;
  for (var i = store.log.length - 1; i >= 0; i--) { var t = store.log[i], items = t.items || [], match = [];
    if (pk && (t.package || "log") != pk) continue;
    if (q) { var head = (t.no + " " + t.to + " " + (t.attn || "") + " " + (t.purpose || "") + " " + (t.notes || "") + " " + (t.source || "") + " " + (t.project || "")).toLowerCase();
      for (var k = 0; k < items.length; k++) if ((items[k].number + " " + (items[k].title || "")).toLowerCase().indexOf(q) >= 0) match.push(k);
      if (head.indexOf(q) < 0 && !match.length) continue; hitItems += match.length; }
    n++; var open = hOpen[t.no] || match.length;
    h.push('<tr class="hr" data-tr="' + esc(t.no) + '"><td><b>' + esc(t.no) + "</b></td><td>" + esc(LT.fmtDate(t.date)) + " " + esc((t.date || "").substring(0, 4)) + "</td><td>" + esc(t.to || "") + (t.attn ? ' <span class="muted">' + esc(t.attn) + "</span>" : "") + "</td><td>" + esc(t.purpose || "") + "</td><td>" + items.length + (match.length ? ' <span class="ok">(' + match.length + " match)</span>" : "") +
      "</td><td>" + pkIcon(t) + '</td><td class="muted">' + esc(t.source || (t.tasks ? "Delegate" : "Transmittal tab")) + '</td><td style="white-space:nowrap">' + (t.zip ? '<span class="hl" data-op="' + esc(t.zip) + '" title="Show the zip">&#128230;</span> ' : "") + (t.dir ? '<span class="hl" data-op="' + esc(t.dir) + '" title="Open the folder">&#128194;</span> ' : "") + (t.file ? '<span class="hl" data-of="' + esc(t.file) + '" title="Open the sheet">&#128196;</span>' : "") + "</td></tr>");
    if (open) { var sub = '<tr class="hi"><td></td><td colspan="7">'; for (var m = 0; m < items.length; m++) sub += '<div' + (match.indexOf(m) >= 0 ? ' class="hit"' : "") + "><b>" + esc(items[m].number) + "</b> " + esc(items[m].rev || "") + ' <span class="muted">' + esc(items[m].title || "") + (items[m].types ? " &middot; " + esc(items[m].types) : "") + "</span></div>";
      h.push(sub + (t.notes ? '<div class="muted">Notes: ' + esc(t.notes) + "</div>" : "") + "</td></tr>"); } }
  h.push("</table>");
  $("hRes").innerHTML = n ? h.join("") : '<div class="muted" style="padding:24px">' + (store.log.length ? "Nothing matches." : "Nothing sent yet. Make a transmittal, or say yes when an export asks <b>Log this to Transmittal?</b>") + "</div>";
  $("hInfo").innerHTML = n + " of " + store.log.length + " transmittal(s)" + (q && hitItems ? " &middot; <b>" + hitItems + "</b> matching item(s)" : "");
  $("hN").innerHTML = store.log.length ? "&nbsp;" + store.log.length : "";
}
function setTv(v) { var bs = $("tvBar").getElementsByTagName("button"); for (var i = 0; i < bs.length; i++) bs[i].className = "btn" + (bs[i].getAttribute("data-tv") == v ? " on" : "");
  var kids = $("app").children; for (var k = 0; k < kids.length; k++) if (kids[k].id != "tvBar" && kids[k].id != "hist") kids[k].style.display = v == "hist" ? "none" : "";
  $("hist").style.display = v == "hist" ? "flex" : "none"; if (v == "hist") histView(); }
$("tvBar").onclick = function (e) { var b = LT.up(e ? e.target : window.event.srcElement, "data-tv"); if (b) setTv(b.getAttribute("data-tv")); };
$("hQ").onkeyup = histView; $("hPk").onchange = histView;
$("hRes").onclick = function (e) { var t = e ? e.target : window.event.srcElement, op = LT.up(t, "data-op"), of = LT.up(t, "data-of"), r = LT.up(t, "data-tr");
  if (op) { try { LT.showInFolder(op.getAttribute("data-op")); } catch (x) { alert("It has moved."); } return; }
  if (of) { try { LT.open(of.getAttribute("data-of")); } catch (x) { alert("The file has moved."); } return; }
  if (r) { var no2 = r.getAttribute("data-tr"); hOpen[no2] = !hOpen[no2]; histView(); } };
$("hCsv").onclick = function () { load(); var t = [["No.", "Date", "To", "Attention", "Purpose", "Package", "From", "Drawing / document", "Rev", "Title", "Types", "Notes"]];
  for (var i = 0; i < store.log.length; i++) { var x = store.log[i]; for (var k = 0; k < (x.items || []).length; k++) { var it = x.items[k]; t.push([x.no, x.date, x.to, x.attn || "", x.purpose || "", x.package || "log", x.source || "", it.number, it.rev || "", it.title || "", it.types || "", x.notes || ""]); } }
  LT.mkdirs(LT.exportsDir()); var f = LT.exportsDir() + "\\Transmittal_history_" + LT.stamp() + ".csv"; LT.writeCsv(f, t); LT.open(f); };
$("bNew").onclick = function () { if (docs.length && !confirm("Clear the documents and start a new transmittal?")) return; docs = []; $("hTo").value = ""; $("hAttn").value = ""; $("hNotes").value = ""; render(); };
$("bLog").onclick = function (e) { var r = this.getBoundingClientRect(); logMenu(r.left - 200, r.bottom + 2); (e || window.event).cancelBubble = true; };
$("docs").onchange = function (e) { var t = e.target || e.srcElement, i = t.getAttribute && t.getAttribute("data-i"); if (i == null) return; var k = t.getAttribute("data-k"); docs[+i][k] = k == "types" ? LT.trim(t.value).split(/\s*,\s*/) : k == "rev" ? LT.trim(t.value).toUpperCase() : LT.trim(t.value); if (k == "rev" || k == "number") render(); };
$("docs").onclick = function (e) { var b = LT.up(e.target || e.srcElement, "data-rm"); if (b) { docs.splice(+b.getAttribute("data-rm"), 1); render(); } };
function look() { LT.applyLook([".num{background:{accent};color:{accText};border-radius:{rc}px}", "#docs{background:{panel}}", "#hRes{background:{panel}}tr.hr{cursor:pointer}tr.hi td{background:{bg};font-size:.92em}tr.hi .hit{background:{okSoft}}.hl{cursor:pointer;font-size:1.1em}.hl:hover{opacity:.7}", "td.rc{font-size:.88em}td.rc.bad{color:{bad};font-weight:bold}td.rc.warn{color:{warn}}td.rc.ok{color:{ok}}td.rc.new{color:{muted}}"]); }
window.ltTheme = look; window.ltReload = function () { load(); header(); if ($("hist").style.display != "none") histView(); };
/* from Folder Check (Submission check view): "add-files" with a JSON list of file paths */
window.ltReceive = function (what, value) { if (what == "reload") { load(); header(); histView(); return; } if (what == "add-files") { try { var n = addFiles(JSON.parse(value)); LT.toast(n + " document(s) added from Folder Check"); fillTitles(true); } catch (e) { } } };
look(); load(); header(); render(); histView(); LT.tabKeys();
</script>
</body>
</html>
