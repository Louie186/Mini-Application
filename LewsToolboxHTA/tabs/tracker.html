<!DOCTYPE html>
<html>
<head>
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta charset="utf-8">
<title>Tasks</title>
<meta name="lt-order" content="2">
<meta name="lt-group" content="Work">
<meta name="lt-icon" content="&#128450;">
<meta name="lt-desc" content="Every task starts here: your own to-dos, and work to hand out - with a description, checklist, who does it (a person or a group) and references (links, files, folders, drawings, notes). Delegate it from here.">
<!--
  Lew's Toolbox - Tasks (was Tracker): the task log. Your own to-dos and tasks to delegate.
  A task: code TL-001, title, project, due, priority, status, who (empty = me; a person or a group), notes (description),
  subs (checklist: code TL-001.1, title, who, due, status, refs), refs (see core\lt-refs.js), delegated { code, to, on }.
  Data: tracker.json in the data folder.
  Delegated tasks: if "delegate-feed.json" is in the data folder (the Delegate tab writes it), its tasks show here
  read-only as "Waiting on <name>". Format: [ { "id", "title", "who", "due" (yyyy-mm-dd), "status", "project" } ]
-->
<style>
#app{display:flex;flex-direction:column;height:100%}
#top,#views,#filters{flex:none}
#main{flex:1 1 auto;overflow:auto;min-height:0}
#quick{width:420px;max-width:60%;margin:0 6px 6px 0}
.lbl{display:inline-block;margin:0 6px 6px 0;vertical-align:middle}
td.cb{width:30px;text-align:center}
td.t{font-weight:bold}
tr.done td{opacity:.6}
tr.done td.t{text-decoration:line-through}
.board{display:flex;padding:8px;height:100%;min-height:300px}
.col{flex:1 1 0px;min-width:0;margin:0 4px;padding:8px;overflow-y:auto}
.col h4{margin-bottom:8px}
.card2{padding:8px 10px;margin-bottom:6px;cursor:pointer}
.card2 b{display:block;margin-bottom:2px}
.card2 .i{font-size:.85em}
#tm{font-weight:bold}
#dlg textarea{height:70px}
#dlg .card{width:900px}
#subs td{padding:2px 3px}#subs input,#subs select{width:100%;height:26px}#subs .sr{width:62px;text-align:center;cursor:pointer;white-space:nowrap}
#subRefs{display:none;margin-top:6px;padding:8px}
.tid{font-family:Consolas,'Lucida Console',monospace;white-space:nowrap}
.sub{font-size:.85em;margin-top:2px}
#tf .card{width:860px}#tfNote{width:100%;height:80px}
#tfDrop{height:270px;overflow:auto}#tfDrop object{width:100%;height:100%}
#tfTabs{margin:8px 0 6px}.tfadd{margin-bottom:6px}.tfp{word-break:break-all}
.tfl td.a{width:60px;text-align:right;white-space:nowrap}.tfl .x{cursor:pointer;margin-left:8px}
.tfn{padding:6px 10px;margin-bottom:6px}.tfn .at{font-size:.85em}.tfn .tx{white-space:pre-wrap}
.tfc{cursor:pointer}
</style>
<script src="../core/lt-core.js"></script>
<script src="../core/lt-refs.js"></script>
<script src="../core/lt-taskfolder.js"></script>
</head>
<body>
<div id="app">
  <div id="top" class="bar">
    <input type="text" id="quick" placeholder="Add a task...   e.g.  Check RFI drawings fri #Tower1 !">
    <button class="btn primary" id="bAdd">+ Add</button>
    <button class="btn" id="bDetail">+ Detailed...</button>
    <button class="btn" id="bOpenTF" title="A folder made with &quot;Task folder&quot; - the Toolbox recognises it (and adds the task if it isn't here yet)">&#128194; Open a task folder...</button>
    <button class="btn" id="bExport">Export &#9662;</button>
    <span class="lbl muted" title="Quick add words:&#10;  today, tomorrow, mon ... sun, next week, 25/11 = due date&#10;  #Project = project (use _ for spaces: #Tower_1)&#10;  ! = high priority, !low = low&#10;  @Name = waiting on someone" style="cursor:help;font-weight:bold">?&nbsp;words</span>
  </div>
  <div id="views" class="bar2"></div>
  <div id="filters" class="bar2">
    <span class="lbl">Project:</span><select id="proj" style="width:170px;margin:0 8px 6px 0"></select>
    <input type="text" id="search" placeholder="Search" style="width:180px;margin:0 8px 6px 0">
    <span class="lbl" id="tm"></span><button class="btn small" id="bStop" style="display:none">&#9632; Stop timer</button>
    <span class="lbl muted" id="hint"></span>
  </div>
  <div id="main"></div>
</div>

<div class="ov" id="dlg"><div class="card">
  <h3 id="dTitle">Task</h3>
  <div class="row2">
    <div class="fld" style="flex:0 0 110px"><label>ID</label><input type="text" id="eCode" disabled></div>
    <div class="fld"><label>Task</label><input type="text" id="eTitle"></div>
  </div>
  <div class="row2">
    <div class="fld"><label>Project</label><input type="text" id="eProj" list="projList"></div>
    <div class="fld"><label>Due (click to pick, or type dd/mm/yyyy; empty = no date)</label><input type="text" id="eDue"></div>
  </div>
  <div class="row2">
    <div class="fld"><label>Priority</label><select id="ePrio"><option>High</option><option selected>Normal</option><option>Low</option></select></div>
    <div class="fld"><label>Status</label><select id="eStat"><option>To do</option><option>Doing</option><option>Waiting</option><option>Done</option></select></div>
  </div>
  <div class="row2">
    <div class="fld"><label>Who does it (empty = me; a person or a group)</label><input type="text" id="eAssign" list="pplList" placeholder="me"></div>
    <div class="fld"><label>Waiting on (for my own tasks)</label><input type="text" id="eWho"></div>
    <div class="fld" style="flex:0 0 150px"><label>Repeat</label><select id="eRep"><option value="">(no repeat)</option><option>Daily</option><option>Weekdays</option><option>Weekly</option><option>Monthly</option></select></div>
  </div>
  <div class="fld"><label>Description / notes</label><textarea id="eNotes" style="width:100%"></textarea></div>
  <div class="fld"><label>References for the whole task (links, files, folders, drawings, notes)</label><div id="eRefs"></div></div>
  <div class="fld"><label>Checklist (optional) &ndash; each item can have its own person, date and references</label>
    <table class="grid" id="subs"></table>
    <button class="btn small" id="eAddSub" style="margin-top:6px">+ Item</button><button class="btn small" id="ePasteSub" style="margin-top:6px" title="Several items at once: one per line">+ Paste items...</button>
    <div id="subRefs"><div class="muted" id="subRefsT" style="margin-bottom:4px"></div><div id="subRefsE"></div></div>
  </div>
  <div class="fld"><label>Time</label><span id="eTime"></span> &nbsp; Add: <input type="text" id="eAddH" style="width:70px" placeholder="1.5 or 0:45"> <button class="btn small" id="eAddB">+ h</button></div>
  <div class="acts"><button class="btn" id="eDel">Delete</button><span class="sp"></span><button class="btn" id="eCancel">Cancel</button><button class="btn" id="eTF" title="Save, then make / open this task's folder">&#128193; Task folder...</button><button class="btn" id="eDeleg" title="Save, then open it in the Delegate tab to hand it out">&#128203; Save and delegate</button><button class="btn primary" id="eOk">Save</button></div>
</div></div>
<datalist id="projList"></datalist><datalist id="pplList"></datalist>

<!-- the task folder: make it, fill it, review it -->
<div class="ov" id="tf"><div class="card">
  <h3 id="tfT">Task folder</h3>
  <div id="tfMake">
    <div class="muted" style="margin-bottom:8px">A folder for everything about this task: <b>Reference</b> (what it's based on), <b>Incoming</b> (what comes back), <b>Output</b> (what you produce), your notes, and a summary (HTML + PDF) with links to every file.</div>
    <div class="fld"><label>Where</label><div style="display:flex"><input type="text" id="tfWhere" style="flex:1 1 auto;margin-right:6px" placeholder="Pick the place for this task's folder"><button class="btn" id="tfBrowse" style="margin:0">Browse...</button></div></div>
    <div class="fld"><label>Folder name</label><input type="text" id="tfName"></div>
    <div class="acts"><span class="sp"></span><button class="btn" id="tfCancel">Cancel</button><button class="btn primary" id="tfMakeB">&#128193; Make the folder</button></div>
  </div>
  <div id="tfBody">
    <div class="tfp"><span class="muted" id="tfPath"></span></div>
    <div style="margin:6px 0 2px"><button class="btn small" id="tfOpen">&#128194; Open in Explorer</button><button class="btn small" id="tfSum">&#128196; Open the summary</button><button class="btn small primary" id="tfUpd">&#8635; Update summary (HTML + PDF)</button><button class="btn small" id="tfRe">Read again</button></div>
    <div id="tfTabs"></div>
    <div id="tfFiles">
      <div class="tfadd"><button class="btn small" id="tfAddF">+ Add files...</button><button class="btn small" id="tfAddD">+ Add a folder...</button><button class="btn small" id="tfShot" title="Take a snip first (Win+Shift+S), then click here">&#128203; Paste screenshot</button>
        <span class="lbl">Add files / Add a folder:</span><label class="lbl"><input type="radio" name="tfMode" id="tfCopy" style="height:auto" checked> Copy</label><label class="lbl"><input type="radio" name="tfMode" id="tfMove" style="height:auto"> Move</label></div>
      <div id="tfDrop"></div>
    </div>
    <div id="tfNotes" style="display:none">
      <textarea id="tfNote" placeholder="Type or paste a note (Teams / email text, a decision, a phone call...) - it's saved with today's date and time"></textarea>
      <div style="margin:4px 0 8px"><button class="btn small primary" id="tfAddN">+ Add note</button></div>
      <div id="tfNList"></div>
    </div>
  </div>
  <div class="acts" id="tfActs"><span class="muted" id="tfMsg"></span><span class="sp"></span><button class="btn" id="tfClose">Close</button></div>
</div></div>

<script>
var $ = LT.$, esc = LT.esc, fso = LT.fso;
var STATUSES = ["To do", "Doing", "Waiting", "Done"], PRIOS = ["High", "Normal", "Low"];
var VIEWS = [["today", "Today"], ["week", "This week"], ["overdue", "Overdue"], ["todel", "To delegate"], ["waiting", "Waiting on others"], ["open", "All open"], ["board", "Board"], ["done", "Done"]];
var data = { tasks: [], view: "today" }, feed = [], shown = [], editing = null, work = null;
function FILE() { return LT.dataPath("tracker.json"); }
function FEED() { return LT.dataPath("delegate-feed.json"); }

/* ---------- data ---------- */
function load() {
  data = LT.readJson(FILE(), null) || { tasks: [], view: "today" };
  if (!data.tasks) data.tasks = [];
  data.seq = data.seq || 0;
  for (var i = 0; i < data.tasks.length; i++) { var t = data.tasks[i]; if (!t.log) t.log = []; if (STATUSES.indexOf(t.status) < 0) t.status = "To do"; if (PRIOS.indexOf(t.priority) < 0) t.priority = "Normal";
    t.subs = t.subs || []; t.refs = t.refs || []; t.who = t.who || ""; if (!t.code) t.code = nextCode(); }
  loadFeed();
}
function nextCode() { var c; do { data.seq++; c = "TL-" + (data.seq < 10 ? "00" : data.seq < 100 ? "0" : "") + data.seq; } while (byCode(c)); return c; }
/* every new task (quick add, form, duplicate, repeat) gets its own TL- number; copies get new item numbers too */
function addTask(t) {
  if (!t.code || byCode(t.code)) { t.code = nextCode(); for (var i = 0; i < (t.subs || []).length; i++) t.subs[i].code = t.code + "." + (i + 1); }
  data.tasks.push(t);
}
function byCode(c) { for (var i = 0; i < data.tasks.length; i++) if (data.tasks[i].code == c) return data.tasks[i]; return null; }
/* the Delegate tab writes delegate-feed.json; tasks that came from here (f.log = TL-...) update their own line */
function loadFeed() {
  feed = []; var changed = false;
  try {
    var a = LT.readJson(FEED(), []) || [];
    for (var i = 0; i < a.length; i++) { var f = a[i]; var st = f.status || f.Status || "";
      var lt = f.log ? byCode(f.log) : null;
      if (lt) { lt.dprog = f.progress || ""; lt.dwho = f.who || ""; lt.dstatus = st;
        if (st == "Completed" && lt.status != "Done") { lt.status = "Done"; lt.doneOn = LT.today(); changed = true; }
        continue; }
      if (st == "Done" || st == "Completed") continue;
      feed.push({ id: "feed:" + (f.id || f.Id || i), title: f.title || f.Title || "", waitingOn: f.who || f.Who || "", due: f.due || f.Due || "", project: f.project || f.Project || "", status: "Waiting", notes: st, priority: "Normal", log: [], subs: [], refs: [], who: "", fromDelegate: true }); }
  } catch (e) { }
  if (changed) save();
}
function save() { try { LT.saveJson(FILE(), data); } catch (e) { alert("Your tasks couldn't be saved to:\n" + FILE()); } }
/* every task the list draws has all its fields (also ones another tab or an older file put in) */
function fix(t) { t.subs = t.subs || []; t.refs = t.refs || []; t.who = t.who || ""; t.log = t.log || []; t.notes = t.notes || ""; t.project = t.project || ""; t.waitingOn = t.waitingOn || ""; if (!t.code && !t.fromDelegate) t.code = nextCode(); return t; }
function all() { for (var i = 0; i < data.tasks.length; i++) fix(data.tasks[i]); return data.tasks.concat(feed); }
function D(s) { return LT.parseIso(s); }
function todayD() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
function hours(t) { var h = 0; for (var i = 0; i < (t.log || []).length; i++) h += t.log[i].hours; return h; }
function overdue(t) { var d = D(t.due); return t.status != "Done" && d && d < todayD(); }
function nice(due) {
  var d = D(due); if (!d) return "";
  var days = Math.round((d - todayD()) / 864e5);
  if (days == 0) return "Today"; if (days == 1) return "Tomorrow"; if (days == -1) return "Yesterday";
  if (days < 0) return LT.fmtDate(due) + "  (" + (-days) + "d late)";
  if (days < 7) return ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d.getDay()];
  return LT.fmtDate(due) + (d.getFullYear() != todayD().getFullYear() ? " " + d.getFullYear() : "");
}
function parseDate(s) {
  s = LT.trim(s); if (!s) return "";
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s); if (m) return LT.iso(new Date(+m[1], +m[2] - 1, +m[3]));
  m = /^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/.exec(s);
  if (m) { var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : todayD().getFullYear(); return LT.iso(new Date(y, +m[2] - 1, +m[1])); }
  return null;
}
function blank() { return { id: LT.uid("t"), code: "", title: "", project: "", due: "", priority: "Normal", status: "To do", waitingOn: "", who: "", notes: "", repeat: "", created: LT.today(), doneOn: "", log: [], timer: 0, subs: [], refs: [], folder: "", fnotes: [] }; }
function hrs(a) { a = LT.trim(a || "").toLowerCase().replace("h", ""); var m = /^(\d+):(\d{1,2})$/.exec(a); if (m) return +m[1] + +m[2] / 60; var n = parseFloat(a.replace(",", ".")); return n > 0 ? n : 0; }

/* quick add:  "Check RFI drawings fri #Tower1 !" */
function parse(text, today) {
  var t = blank(); t.created = LT.iso(today);
  var words = [], parts = LT.trim(text).split(/\s+/), days = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  for (var i = 0; i < parts.length; i++) {
    var w = parts[i], l = w.toLowerCase().replace(/[,.]$/, ""), m;
    if (!w) continue;
    if (l == "today" || l == "tod") t.due = LT.iso(today);
    else if (l == "tomorrow" || l == "tmr" || l == "tom") t.due = LT.iso(addDays(today, 1));
    else if (l == "next" && parts[i + 1] && /^week/i.test(parts[i + 1])) { t.due = LT.iso(addDays(weekStart(today), 7)); i++; }
    else if (/^(mon|tue|wed|thu|fri|sat|sun)$|^(monday|tuesday|wednesday|thursday|friday|saturday|sunday|tues|weds|thur|thurs)$/.test(l)) {
      var want = days.indexOf(l.substring(0, 3)), add = (want - today.getDay() + 7) % 7; if (add == 0) add = 7; t.due = LT.iso(addDays(today, add)); }
    else if ((m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(l))) {
      var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : today.getFullYear(), d = new Date(y, +m[2] - 1, +m[1]);
      if (!m[3] && d < addDays(today, -60)) d = new Date(y + 1, +m[2] - 1, +m[1]);
      t.due = LT.iso(d); }
    else if (w.charAt(0) == "#" && w.length > 1) t.project = w.substring(1).replace(/_/g, " ");
    else if (w.charAt(0) == "@" && w.length > 1) { t.waitingOn = w.substring(1).replace(/_/g, " "); t.status = "Waiting"; }
    else if (w.charAt(0) == "&" && w.length > 1) t.who = w.substring(1).replace(/_/g, " ");
    else if (l == "!" || l == "!!" || l == "!high") t.priority = "High";
    else if (l == "!low") t.priority = "Low";
    else words.push(w);
  }
  t.title = words.join(" ");
  return t;
}

/* ---------- what to show ---------- */
function pick(view) {
  var today = todayD(), wEnd = addDays(weekStart(today), 6), proj = $("proj").value, words = LT.trim($("search").value.toLowerCase()).split(/\s+/), out = [], a = all();
  for (var i = 0; i < a.length; i++) {
    var t = a[i], d = D(t.due), done = t.status == "Done";
    if (proj && t.project != proj) continue;
    if (words[0]) { var hay = (t.code + " " + t.title + " " + t.project + " " + t.notes + " " + t.waitingOn + " " + t.who).toLowerCase(), ok = true; for (var w = 0; w < words.length; w++) if (hay.indexOf(words[w]) < 0) ok = false; if (!ok) continue; }
    if (view == "today" && !(!done && (t.status == "Doing" || (d && d <= today)))) continue;   // everything due today, whoever has it (Who column)
    if (view == "week" && !(!done && (t.status == "Doing" || (d && d <= wEnd)))) continue;
    if (view == "todel" && !(!done && t.who && !t.delegated)) continue;
    if (view == "waiting" && !(!done && (t.delegated || t.fromDelegate || t.status == "Waiting"))) continue;
    if (view == "overdue" && !overdue(t)) continue;
    if (view == "open" && done) continue;
    if (view == "board" && done && !(D(t.doneOn) && D(t.doneOn) >= addDays(today, -14))) continue;
    if (view == "done" && !done) continue;
    out.push(t);
  }
  if (view == "done") out.sort(function (a, b) { return (b.doneOn || "") < (a.doneOn || "") ? -1 : (b.doneOn || "") > (a.doneOn || "") ? 1 : 0; });
  else out.sort(function (a, b) {
    var x = a.due || "9999", y = b.due || "9999"; if (x != y) return x < y ? -1 : 1;
    var p = PRIOS.indexOf(a.priority) - PRIOS.indexOf(b.priority); if (p) return p;
    return a.title.toLowerCase() < b.title.toLowerCase() ? -1 : 1; });
  return out;
}

function render() {
  // project list
  var keep = $("proj").value, seen = {}, ps = [], a = all();
  for (var i = 0; i < a.length; i++) if (a[i].project && !seen[a[i].project]) { seen[a[i].project] = 1; ps.push(a[i].project); }
  ps.sort();
  var h = '<option value="">All projects</option>', dl = "";
  for (var j = 0; j < ps.length; j++) { h += '<option' + (ps[j] == keep ? " selected" : "") + ">" + esc(ps[j]) + "</option>"; dl += '<option value="' + esc(ps[j]) + '">'; }
  $("proj").innerHTML = h; $("projList").innerHTML = dl;
  // view buttons with counts
  h = "";
  for (var v = 0; v < VIEWS.length; v++) { var k = VIEWS[v][0], n = k == "board" || k == "done" ? -1 : pick(k).length;
    h += '<button class="btn' + (data.view == k ? " on" : "") + (k == "overdue" && n > 0 ? " late" : "") + '" data-v="' + k + '">' + VIEWS[v][1] + (n >= 0 ? " &nbsp;" + n : "") + "</button>"; }
  $("views").innerHTML = h;
  if (data.view == "board") board(); else list();
  timer();
}
function list() {
  shown = pick(data.view);
  var h = ['<table class="grid"><tr><th></th><th>ID</th><th>Task</th><th>Who</th><th>Project</th><th>Due</th><th>Priority</th><th>Status</th><th>Hours</th><th>Notes</th></tr>'];
  for (var i = 0; i < shown.length; i++) {
    var t = shown[i], st = statusText(t), hr = hours(t), nd = 0; for (var q = 0; q < t.subs.length; q++) if (t.subs[q].status == "Done") nd++;
    var extra = (t.folder ? '<span class="rfc tfc" data-tf="' + i + '" title="' + esc(t.folder) + ' - click to open the task folder">&#128193; folder</span> ' : "") + (t.subs.length ? '<span class="muted">&#9745; ' + nd + "/" + t.subs.length + "</span> " : "") + LT.refChips(t.refs);
    var dueCls = overdue(t) ? "bad" : (t.due == LT.today() && t.status != "Done" ? "today" : "");
    h.push('<tr data-i="' + i + '" class="' + (t.status == "Done" ? "done" : "") + '"><td class="cb"><input type="checkbox" data-done="' + i + '" style="height:auto"' + (t.status == "Done" ? " checked" : "") + (t.fromDelegate ? " disabled" : "") + '></td>' +
      '<td class="tid">' + esc(t.code || "") + '</td><td class="t">' + (t.fromDelegate ? "&#128203; " : "") + (t.timer ? "&#9201; " : "") + esc(t.title) + (t.repeat ? " &#8635;" : "") + (extra ? '<div class="sub">' + extra + "</div>" : "") + "</td><td>" + esc(t.who || (t.fromDelegate ? t.waitingOn : "")) + "</td><td>" + esc(t.project) + '</td><td class="' + dueCls + '">' + (t.status == "Done" ? "done " + esc(nice(t.doneOn)) : esc(nice(t.due))) +
      '</td><td class="' + (t.priority == "High" ? "bad" : "") + '">' + (t.priority == "Normal" ? "" : t.priority) + '</td><td class="' + (t.status == "Doing" ? "ok" : t.status == "Waiting" || t.delegated ? "warn" : t.who && !t.delegated && t.status != "Done" ? "todel" : "") + '">' + esc(st) +
      "</td><td>" + (hr ? Math.round(hr * 100) / 100 : "") + '</td><td class="muted">' + esc((t.notes || "").replace(/\s+/g, " ")) + "</td></tr>");
  }
  h.push("</table>");
  $("main").innerHTML = shown.length ? h.join("") : '<div class="muted" style="padding:30px">' + (data.view == "today" ? "Nothing due today &ndash; nice. Type a task above and press Enter." : "Nothing here.") + "</div>";
  $("hint").innerHTML = shown.length ? "Double-click = edit &middot; tick = done &middot; right-click = more (Delegate this task...)" + (data.view == "todel" ? " &middot; <b>right-click &gt; Delegate this task</b> to hand it out" : "") : "";
}

    for (var l = 0; l < t.log.length; l++) { var ld = D(t.log[l].date); if (ld && ld >= ws && ld <= we) { var p = t.project || "(no project)"; hp[p] = (hp[p] || 0) + t.log[l].hours; } } }
  var a = all(); for (var j = 0; j < a.length; j++) if (a[j].status == "Waiting") waiting.push(a[j]);
  var s = "Week " + ws.getDate() + " " + LT.MON[ws.getMonth()] + " – " + we.getDate() + " " + LT.MON[we.getMonth()] + " " + we.getFullYear() + (LT.settings().userName ? "  (" + LT.settings().userName + ")" : "") + "\r\n\r\n";
  s += "DONE (" + done.length + ")\r\n"; for (var k = 0; k < done.length; k++) s += "  • " + done[k].title + (done[k].project ? "  [" + done[k].project + "]" : "") + "\r\n";
  s += "\r\nSTILL OPEN – due this week or late (" + open.length + ")\r\n"; for (k = 0; k < open.length; k++) s += "  • " + open[k].title + "  – " + nice(open[k].due) + (open[k].project ? "  [" + open[k].project + "]" : "") + "\r\n";
  if (waiting.length) { s += "\r\nWAITING ON OTHERS (" + waiting.length + ")\r\n"; for (k = 0; k < waiting.length; k++) s += "  • " + waiting[k].title + " – " + (waiting[k].waitingOn || "?") + (waiting[k].due ? ", due " + nice(waiting[k].due) : "") + "\r\n"; }
  var tot = 0, hl = ""; for (var pk in hp) if (hp.hasOwnProperty(pk)) { tot += hp[pk]; hl += "  • " + pk + ": " + Math.round(hp[pk] * 10) / 10 + " h\r\n"; }
  if (tot) s += "\r\nTIME (" + Math.round(tot * 10) / 10 + " h)\r\n" + hl;
  return s;
}
function exportMenu(x, y) {
  LT.menu(x, y, [
    { label: "&#128203; Copy this week's summary (for email / Teams)", fn: function () { if (LT.copyText(weekly())) LT.toast("This week's summary is copied"); } },
    { label: "Weekly summary &rarr; Excel (CSV)", fn: function () { var rows = [["Weekly summary"]], ls = weekly().split("\r\n"); for (var i = 0; i < ls.length; i++) rows.push([ls[i].replace(/^\s*•\s*/, "")]); var f = LT.exportsDir() + "\\Tasks_week_" + LT.stamp() + ".csv"; LT.writeCsv(f, rows); LT.open(f); } },
    { label: "All tasks &rarr; Excel (CSV)", fn: function () {
      var rows = [["ID", "Task", "Who", "Project", "Due", "Priority", "Status", "Waiting on", "Repeat", "Hours", "Done on", "Created", "Description / notes", "Checklist", "References"]];
      for (var i = 0; i < data.tasks.length; i++) { var t = data.tasks[i], cl = []; for (var c = 0; c < t.subs.length; c++) cl.push(t.subs[c].code + " " + t.subs[c].title + (t.subs[c].who ? " (" + t.subs[c].who + ")" : "") + (t.subs[c].status == "Done" ? " [done]" : ""));
        rows.push([t.code, t.title, t.who, t.project, t.due, t.priority, statusText(t), t.waitingOn, t.repeat, hours(t) ? Math.round(hours(t) * 100) / 100 : "", t.doneOn, t.created, t.notes, cl.join("\n"), LT.refLines(t.refs).join("\n")]); }
      var f = LT.exportsDir() + "\\Tasks_all_" + LT.stamp() + ".csv"; LT.writeCsv(f, rows); LT.open(f); } }]);
}

/* ---------- events ---------- */
function look() { LT.applyLook(["td.today{color:{accent};font-weight:bold}", ".btn.late{color:{bad}}", ".col{background:{chip};border-radius:{r}px}", ".card2{background:{panel};border:{bw}px solid {line};border-radius:{r}px}", ".card2.hi{border-color:{bad}}", ".col.over{outline:2px dashed {accent}}", "td.todel{color:{accent};font-weight:bold}", "#subRefs{background:{bg};border:{bw}px solid {line};border-radius:{r}px}", "#subs tr.sel td{background:{hover}}", "#subs .sr:hover{color:{accent}}", ".tfn{background:{bg};border-left:3px solid {accent};border-radius:{r}px}", "#tfDrop{border:{bw}px solid {line};border-radius:{r}px;background:{bg}}", ".tfc:hover{color:{accent}}"].concat(LT.REF_CSS)); }
$("bAdd").onclick = quickAdd;
$("quick").onkeydown = function (e) { e = e || window.event; if (e.keyCode == 13) { quickAdd(); return false; } };
$("bDetail").onclick = function () { edit(null); };
$("bExport").onclick = function (e) { var r = this.getBoundingClientRect(); exportMenu(r.left, r.bottom + 2); (e || window.event).cancelBubble = true; };
$("views").onclick = function (e) { var b = LT.up(e.target || e.srcElement, "data-v"); if (b) { data.view = b.getAttribute("data-v"); save(); render(); } };
$("proj").onchange = render; $("search").onkeyup = render;
$("bStop").onclick = function () { for (var i = 0; i < data.tasks.length; i++) stopTimer(data.tasks[i]); save(); render(); };
$("main").onclick = function (e) { var t = e.target || e.srcElement, d = t.getAttribute && t.getAttribute("data-done"), tf = LT.up(t, "data-tf"); if (tf) { openTF(shown[+tf.getAttribute("data-tf")]); return; } if (d != null) { var task = shown[+d]; setStatus(task, t.checked ? "Done" : "To do"); } };
$("main").ondblclick = function (e) { var r = LT.up(e.target || e.srcElement, "data-i"); if (r) edit(shown[+r.getAttribute("data-i")]); };
$("main").oncontextmenu = function (e) { e = e || window.event; var r = LT.up(e.target || e.srcElement, "data-i"); if (r) taskMenu(shown[+r.getAttribute("data-i")], e.clientX, e.clientY); return false; };
/* board: drag a card to another column */
var dragI = null;
$("main").ondragstart = function (e) { e = e || window.event; var c = LT.up(e.target || e.srcElement, "data-i"); if (!c) return; dragI = +c.getAttribute("data-i"); try { e.dataTransfer.setData("text", "" + dragI); } catch (x) { } };
$("main").ondragover = function (e) { e = e || window.event; var col = LT.up(e.target || e.srcElement, "data-st"); if (col) { if (e.preventDefault) e.preventDefault(); e.returnValue = false; } return false; };
$("main").ondragenter = function (e) { e = e || window.event; var col = LT.up(e.target || e.srcElement, "data-st"); if (col) { if (e.preventDefault) e.preventDefault(); col.className = "col over"; } return false; };
$("main").ondragleave = function (e) { e = e || window.event; var col = LT.up(e.target || e.srcElement, "data-st"); if (col) col.className = "col"; };
$("main").ondrop = function (e) { e = e || window.event; if (e.preventDefault) e.preventDefault(); var col = LT.up(e.target || e.srcElement, "data-st"); if (col && dragI != null && shown[dragI]) { var st = col.getAttribute("data-st"), t = shown[dragI]; dragI = null; if (t.status != st) setStatus(t, st); else render(); } return false; };
$("eOk").onclick = function () { saveEdit(); };
$("eDeleg").onclick = function () { if (!LT.trim($("eAssign").value)) { alert("Fill in who does it first (a person or a group)."); return; } saveEdit(); if ($("dlg").style.display == "none") { var t = byCode(work.code); if (t) delegate(t); } };
$("eTF").onclick = function () { saveEdit(); if ($("dlg").style.display == "none") { var t = byCode(work.code); if (t) openTF(t); } };
$("bOpenTF").onclick = openTaskFolder;
$("tfBrowse").onclick = function () { var f = LT.pickFolder("Where should this task's folder go?"); if (f) $("tfWhere").value = f; };
$("tfMakeB").onclick = makeTF; $("tfCancel").onclick = function () { $("tf").style.display = "none"; };
$("tfClose").onclick = closeTF;
$("tfOpen").onclick = function () { try { LT.open(tfTask.folder + (tfSub != "Notes" ? "\\" + tfSub : "")); } catch (e) { } };
$("tfSum").onclick = function () { var p = LT.tfSummaryPath(tfTask.folder); if (!LT.fso.FileExists(p)) LT.tfSave(tfTask.folder, tfTask, { pdf: false }); try { LT.open(p); } catch (e) { } };
$("tfUpd").onclick = function () { $("tfMsg").innerHTML = "Making the summary..."; var r = LT.tfSave(tfTask.folder, tfTask); tfDirty = false; $("tfMsg").innerHTML = "Summary updated (Reference \\ Backup and Ref): Task Summary.html" + (r.pdf ? " + Task Summary.pdf" : r.locked ? ' &middot; <span class="warn">the PDF is open in a viewer - close it, then Update summary again</span>' : ' &middot; <span class="warn">no PDF (needs Edge, Chrome or Word)</span>'); };
$("tfRe").onclick = function () { tfShow(tfSub); };
$("tfTabs").onclick = function (e) { var b = LT.up(e ? e.target : window.event.srcElement, "data-tfs"); if (b) tfShow(b.getAttribute("data-tfs")); };
$("tfCopy").onclick = function () { tfMode(false); }; $("tfMove").onclick = function () { tfMode(true); };
$("tfAddF").onclick = function () { LT.pickFile(function (p) { var r = LT.tfAdd(tfTask.folder, tfSub, [p], $("tfMove").checked); tfAfter(r, (r.added.length ? ($("tfMove").checked ? "Moved " : "Copied ") + r.added.join(", ") + " to " + tfSub : "")); }); };
$("tfAddD").onclick = function () { var d = LT.pickFolder("Pick a folder to " + ($("tfMove").checked ? "move" : "copy") + " into " + tfSub); if (!d) return; var r = LT.tfAdd(tfTask.folder, tfSub, [d], $("tfMove").checked); tfAfter(r, r.added.length ? ($("tfMove").checked ? "Moved " : "Copied ") + r.added.join(", ") + " to " + tfSub : ""); };
$("tfShot").onclick = function () { var nm = LT.tfPasteShot(tfTask.folder, tfSub); if (nm) tfAfter({}, "Screenshot saved: " + nm); else $("tfMsg").innerHTML = '<span class="warn">No picture on the clipboard - take a snip first (Win+Shift+S), then click Paste screenshot.</span>'; };
$("tfAddN").onclick = function () { var v = LT.trim($("tfNote").value); if (!v) { $("tfNote").focus(); return; } var d = new Date(); tfTask.fnotes = tfTask.fnotes || []; tfTask.fnotes.push({ at: LT.today() + " " + LT.pad(d.getHours()) + ":" + LT.pad(d.getMinutes()), text: v }); $("tfNote").value = ""; save(); tfAfter({}, "Note added"); tfNotes(); };
$("tfNList").onclick = function (e) { var x = LT.up(e ? e.target : window.event.srcElement, "data-tfdn"); if (x && confirm("Delete this note?")) { tfTask.fnotes.splice(+x.getAttribute("data-tfdn"), 1); save(); tfAfter({}, "Note deleted"); tfNotes(); } };
$("tfDrop").onclick = function (e) { e = e || window.event; var t = e.target || e.srcElement, o = LT.up(t, "data-tfo"), s = LT.up(t, "data-tfin"); if (o) { try { LT.open(o.getAttribute("data-tfo")); } catch (x) { } if (e.preventDefault) e.preventDefault(); e.returnValue = false; return false; } if (s) { try { LT.showInFolder(s.getAttribute("data-tfin")); } catch (x) { } } };
$("eAddSub").onclick = function () { readSubs(); work.subs.push({ code: "", title: "", who: "", due: "", status: "To do", refs: [] }); drawSubs(); var ins = $("subs").getElementsByTagName("input"); try { ins[ins.length - 3].focus(); } catch (e) { } };
$("ePasteSub").onclick = function () { var t = prompt("Paste the items - one per line (separate with  ;  if this box joins the lines):", ""); if (!t) return; readSubs(); var ls = t.split(/\r?\n|;/); for (var i = 0; i < ls.length; i++) if (LT.trim(ls[i])) work.subs.push({ code: "", title: LT.trim(ls[i]), who: "", due: "", status: "To do", refs: [] }); drawSubs(); };
$("subs").onclick = function (e) { var t = e ? e.target : window.event.srcElement, d = LT.up(t, "data-sdel"), r = LT.up(t, "data-sref");
  if (d) { readSubs(); var i = +d.getAttribute("data-sdel"); work.subs.splice(i, 1); if (subRef == i) { subRef = -1; $("subRefs").style.display = "none"; } else if (subRef > i) subRef--; drawSubs(); }
  else if (r) showSubRefs(+r.getAttribute("data-sref")); }; $("eCancel").onclick = function () { $("dlg").style.display = "none"; };
$("eDel").onclick = function () { $("dlg").style.display = "none"; if (editing) del(editing); };
$("eAddB").onclick = function () { var h = hrs($("eAddH").value); if (h > 0) { work.log.push({ date: LT.today(), hours: h }); $("eAddH").value = ""; showTime(); } };
$("dlg").onkeydown = function (e) { e = e || window.event; var tg = (e.target || e.srcElement).tagName; if (e.keyCode == 27) $("dlg").style.display = "none"; if (e.keyCode == 13 && tg == "INPUT" && (e.target || e.srcElement).id != "eAddH") saveEdit(); };
window.setInterval(timer, 1000);

/* called by the main window */
window.ltTheme = function () { look(); render(); };
window.ltReload = function () { load(); render(); };
window.ltShown = function () { loadFeed(); render(); try { $("quick").focus(); } catch (e) { } };
/* from Home: "add-task" with quick-add words, "view" to open a view */
window.ltReceive = function (what, value) {
  if (what == "add-task" && value) { var v = data.view; data.view = "today"; $("quick").value = value; quickAdd(); data.view = v; save(); render(); }
  else if (what == "view") { data.view = value; save(); render(); }
  /* from Delegate: the task is handed out  { log: "TL-001", code: "T004", to: "Sam", tr: "TR-005" } */
  else if (what == "delegated") { var v = JSON.parse(value), t = byCode(v.log); if (t) { t.delegated = { code: v.code, to: v.to, on: LT.today(), tr: v.tr || "" }; if (t.status == "To do") t.status = "Waiting"; save(); render(); } }
};
look(); load(); render(); LT.tabKeys(); LT.datePicker(function (i) { return i.id == "eDue" || /(^| )sD( |$)/.test(i.className); });
